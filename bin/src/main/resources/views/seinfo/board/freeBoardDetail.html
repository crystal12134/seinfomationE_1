     <script type="text/javascript" th:inline="javascript">
        const paginationImages = {

        //자유게시판 상세페이지 다시 불러오기
        function reloadFreeBoardList(flag) {

            $.ajax({
                type: "POST",
                url: '/board/freeBoardList/reloadFreeBoardDetail',
                data: JSON.stringify({freeboardNo : freeBoardDetail.freeboardNo}),
                contentType: 'application/json',
                success: function (response) {
                    freeBoardDetail = response.freeBoardDetail;
                    commentList = response.commentList;
                    $.each (commentList, (index, item) => {
                        $(`#comment-like-count-${pf.safeId(item.commentNo)}`).text(`${pf.escapeHtml(item.likeCount)}`);
                        $(`#comment-hate-count-${pf.safeId(item.commentNo)}`).text(`${pf.escapeHtml(item.hateCount)}`);
                    });
                    if(flag) {
                        $('#like-count').text(freeBoardDetail.likeCount);
                        $('#hate-count').text(freeBoardDetail.hateCount);
                    }
                },
                error: function (jqXHR) {
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    pf.seinfoAlert.warning('[(#{seinfo.com.msg.00170})] <br> '+ msg);//[조회오류]....
                }
            });
        }

        //자유게시판 원댓글 다시 불러오기
        function reloadCommentList() {

// log.info("parentComments is null? {}", parentComments == null);
// log.info("parentComments size: {}", parentComments.size());

        //자유게시판 상세페이지 댓글 등록 : 저장
        function FreeBoardComment(form) { 

            const $form = $(form);

            const commentContent = $form.find("textarea[name='commentContent']").val();
            const parentNo = $form.find("input[name='parentNo']").val();

            if (pf.zzzUtil.isEmpty(commentContent)) { console.log('commentContent:', commentContent);
                pf.seinfoAlert.focus(0, '내용을 입력하세요', $form.find("textarea[name='commentContent']"));
                return;
            } else if (commentContent.length > 300) {
                const msg = '[(#{seinfo.com.msg.00100})]'; // 입력 길이 초과
                pf.seinfoAlert.focus(0, msg, $form.find("textarea[name='commentContent']"));
                return;
            }

            const freeBoardModify = {
                modifyYn: 'N',
                commentNO: null
            };

            const formData = {
                freeboardNo : freeBoardDetail.freeboardNo,
                parentNo : parentNo === '' ? null : parentNo,
                commentNO : freeBoardModify.modifyYn === 'Y' ? freeBoardModify.commentNO : null,
                commentContent: commentContent,
                modifyYn: freeBoardModify.modifyYn,
                likeCount: freeBoardComment.likeCount,
                hateCount: freeBoardComment.hateCount,
                modDt: freeBoardComment.modDt,
                regDt: freeBoardComment.regDt,
                userId: pf.token().USER_ID
            };

            $.ajax({
                type: "POST",
                url: '/board/freeBoardList/registFreeBoardComment',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function (response) { 
                // fnInit();
                    
                    //등록되었습니다.
                    pf.seinfoAlert.success('등록되었습니다.', () => {
                        window.location.reload();
                    });
                },
                error: function (jqXHR) {
                    //fnInit();
                
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    //[저장오류]...
                    pf.seinfoAlert.warning('댓글이 등록되지 않았습니다.', ()=>{ //댓글이 등록되지 않았습니다
                    });
                }
            });
        }


        // 게시글 추천 비추천 버튼 클릭시 
        $(document).ready(function () {
            function handleLikeDislike(type) {
                const isLike = type === 'like';
                const $button = isLike ? $('#like-button') : $('#hate-button');
                const $countSpan = isLike ? $('#like-count') : $('#hate-count');
                const postId = $button.data('post-id');
                const count = parseInt($countSpan.text(), 10) || 0;

                $.ajax({
                    url: '/board/freeBoardList/likePost',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        freeboardNo: postId,
                        likeSort: isLike ? 'Y' : 'N'
                    }),
                    success: function (response) {
                        if (response.process_code === '00') {
                            // 서버로부터 좋아요/싫어요 여부를 다시 받아서 상태 업데이트하는 게 더 안정적
                            reloadFreeBoardList(true);
                        } else {
                            alert('처리 실패: ' + response.process_msg);
                        }
                    },
                    error: function () {
                        alert('에러 발생');
                    }
                });
            }

            $('#like-button').on('click', function () {
                handleLikeDislike('like');
            });

            $('#hate-button').on('click', function () {
                handleLikeDislike('dislike');
            });
        });



        //목록 그리드 하단 페이지 처리
        function renderPagination(pageResult) {
            let pagination = "";

            //첫 페이지 버튼
            if(pageResult.cPage > 1) {
                pagination += `<button type="button" class="page-navi first" style="display: block" data-page="1">
                    <img src="${paginationImages.first}">
                </button>`;
            }

            //이전페이지 이동
            if(pageResult.hPrev) {
                pagination += `<button type="button" class="page-navi prev" style="display: block" data-page="${pageResult.cPage -1}">
                    <img src="${paginationImages.prev}">
                </button>`;
            }

            //페이지 번호
            let startPage = Math.max(1, pageResult.cPage -5);
            let endPage = Math.min(pageResult.totalPages, pageResult.cPage +5);

            pagination += `<div class="page-links">`;
            for(let i = startPage; i <= endPage; i++) {
                let activeClass = (pageResult.cPage === i) ? "active" : "";
                pagination += `<button class="page-link ${activeClass}" data-page="${i}">${i}</button>`;
            }
            pagination += `</div>`;

            //다음 페이지 버튼
            if(pageResult.hNext){
                pagination += `<button type="button" class="page-navi next" style="display: block" data-page="${pageResult.cPage + 1}">
                    <img src="${paginationImages.next}">
                </button>`;
            }

            //마지막 페이지 버튼
            if(pageResult.cPage < pageResult.totalPages){
                pagination += `<button type="button" class="page-navi last" style="display: block" data-page="${pageResult.totalPages}">
                    <img src="${paginationImages.last}">
                </button>`;
            }
            $(".pagination").html(pagination);
        }

        function fnInputSetPlaceholder() {
            $("#keyword").attr("placeholder", "[(#{seinfo.main.msg.00150})]"); //검색어를 입력하세요.
        }

         //자유게시판 상세페이지로 이동
        function moveView(freeboardNo) {
            let arrLinkparam = [];
            arrLinkparam.push('&freeboardNo=' + freeboardNo);
            arrLinkparam.push('&page=' + page);

            let encData = pf.zzzUtil.getEncryptParam(arrLinkparam.join(''));
            location.href = contextPath + '/board/freeBoardList/freeBoardDetail'+  '?paramData=' + encData;

        // 답글 버튼 클릭시
       function toggleReplyForm(index) {
            const replyForm = document.getElementById('reply-form-' + index);
            const replyBtn = document.getElementById('reply-btn-' + index);

            if (replyForm && replyBtn) {
                replyForm.style.display = 'table-row';  // 폼 보이기
                replyBtn.style.display = 'none';        // 버튼 숨기기
            }
        }

        // 답글 취소 버튼 클릭시
        function cancelReplyForm(index) {
            const replyForm = document.getElementById('reply-form-' + index);
            const replyBtn = document.getElementById('reply-btn-' + index);

            if (replyForm && replyBtn) {
                replyForm.style.display = 'none';       // 입력창 닫기
                replyBtn.style.display = 'inline-block'; // 답글 버튼 다시 보이기

        /*

        //추천
        function likeChildComment(commentNo) {
            
             const commentId = commentNo;
             const text = $(`#childCommetLikeCount-${commentNo}`).text();
             const likeCount = parseInt(text.replace(/[^0-9]/g, ''), 10) || 0;

            pf.seinfo.ajax({
                url: '/board/freeBoardList/likeComment',
                method: 'POST',
                data: { commentNo: commentId, likeSort: "Y" }
            }, (response) => {
                if(response.data === 'A') {
                    //성공 시 숫자 +1
                    const newLikeCount = likeCount + 1;
                    $(`#childCommetLikeCount-${commentNo}`).text(`👍 ${newLikeCount}`);
                }else if(response.data === 'B') {
                    const newLikeCount = likeCount - 1;
                    $(`#childCommetLikeCount-${commentNo}`).text(`👍 ${newLikeCount}`);
                }else if(response.data === 'C') {
                    const tmp = $(`#childCommethateCount-${commentNo}`).text();
                    const hate = parseInt(tmp.replace(/[^0-9]/g, ''), 10) || 0;
                    const newHateCount = hate === 0? 0 : hate - 1;
                    $(`#childCommethateCount-${commentNo}`).text(`👎 ${newHateCount}`);
                    const newLikeCount = likeCount + 1;
                    $(`#childCommetLikeCount-${commentNo}`).text(`👍 ${newLikeCount}`);
                }
            });
        }

        //비추천
        function hateChildComment(commentNo) {
            
             const commentId = commentNo;
             const text = $(`#childCommethateCount-${commentNo}`).text();
             const hateCount = parseInt(text.replace(/[^0-9]/g, ''), 10) || 0;

            
            pf.seinfo.ajax({
                url: '/board/freeBoardList/likeComment',
                method: 'POST',
                data: { commentNo: commentId, likeSort: "N" }
            }, (response) => {
                if(response.data === 'A') {
                    // 성공 시 숫자 +1
                    const newHateCount = hateCount + 1;
                    $(`#childCommethateCount-${commentNo}`).text(`👎 ${newHateCount}`);
                }else if(response.data === 'B') {
                    const newHateCount = hateCount - 1;
                    $(`#childCommethateCount-${commentNo}`).text(`👎 ${newHateCount}`);
                }else if(response.data === 'C') {
                    const tmp = $(`#childCommetLikeCount-${commentNo}`).text();
                    const like = parseInt(tmp.replace(/[^0-9]/g, ''), 10) || 0;
                    const newLikeCount = like === 0 ? 0 : like - 1;
                    $(`#childCommetLikeCount-${commentNo}`).text(`👍 ${newLikeCount}`);
                    const newHateCount = hateCount + 1;
                    $(`#childCommethateCount-${commentNo}`).text(`👎 ${newHateCount}`);
                }
            });
        }
