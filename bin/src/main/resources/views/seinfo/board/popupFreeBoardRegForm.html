    const config = {
        ckeditInstances: [],

        filesPrev: true,
        uploadFileCnt: 0,
        dataToServer: '',
        boardFileYn: 'Y',

    //CKEditor 초기화
    const ckedit_init = (target, data, readonly) => {
        let selector = document.querySelector("#" + target);

        //이미 존재하는 인스턴스 파괴
        if(config.ckeditInstances[target]) {
            config.ckeditInstances[target].destroy();
            delete config.ckeditInstances[target];
        }

        ClassicEditor.create(selector, {
            toolbar: {
                items: [
                    'heading', 'undo', 'redo',
                    'bold', 'bulletedList', 'numberedList',
                    'fontColor', 'fontSize', 'fontFamily', 'highlight',
                    'link', 'imageUpload', 'blockQuote', 'insertTable'
                ]
            },
            image: {
                resizeUnit: 'px',
                toolbar: ['imageTextAlternative', 'imageStyle:alignLeft', 'imageStyle:alignCenter', 'imageStyle:alignRight', 'imageStyle:side'],
                styles: ['full', 'alignLeft', 'alignCenter', 'alignRight', 'side']
            },
            language: 'ko',
            fontFamily: {
                options: [
                    'default',
                    'Arial',
                    '궁서체',
                    '맑은고딕',
                    '바탕체',
                    '현대산스 Head',
                    '현대산스 Text',
                    '현대하모니'
                ],
                supportAllValues: true
            },
            fontSize: {
                options: [9, 11, 13, 'default', 17, 19, 21, 24, 27, 32]
            },
            table: {
                contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells', 'tableCellProperties', 'tableProperties']
            },
            extraPlugins: [customUploadAdapterPlugin]
        }).then(editor => {
            editor.setData(data);
            config.ckeditInstances[target] = editor; //인스턴스를 해당 타겟으로 저장

            if(readonly) {
                editor.enableReadOnlyMode(target);
                editor.ui.view.editable.element.classList.add('editor-readonly');
                $('.ck .ck-sticky-panel__content').css('display', 'none');
            }
        });
    };

    //CKEditor 업로드 플러그인 설정

        editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
            return new uploadAdapter(loader, editor.t);

    //자유게시판 등록 : 저장
    function registFreeBoard() {
        const title = $("#modalFreeBoardTitle").val();
        const freeboardNo = $("#modalFreeBoardNo").val(); // ← 게시글 번호
    
        if (pf.zzzUtil.isEmpty(title)) {
            pf.seinfoAlert.focus(0, '[(#{seinfo.main.msg.00130})]', $('#modalFreeBoardTitle'));
            return;
        } else if (title.length > 100) {
            var msg = '[(#{seinfo.board.label.00015})]' + '[(#{seinfo.com.msg.00100})]';
            pf.seinfoAlert.focus(0, msg, $('#modalFreeBoardTitle'));
            return;
        }
        
        $('#freeBoardContent').val(config.ckeditInstances['popupFreeBoardReg'].getData());
        let freeBoardContent = $('#freeBoardContent').val();
        if(pf.zzzUtil.isEmpty(freeBoardContent)) {
            pf.seinfoAlert('[(#{seinfo.pps.msg.00020})]'); //내용을 입력하세요.
            return;
        }

        // 수정&등록 URL 분기
        let url = freeboardNo ? '/board/freeBoardList/updateFreeBoard' : '/board/freeBoardList/registFreeBoard';
        // 게시글 번호 있으면 PUT, 없으면 POST
        let method = freeboardNo ? 'PUT' : 'POST';
console.log("현재 게시글 번호:", freeboardNo + method);  
        const formData = {
            freeBoardNo: freeboardNo || null,
            freeBoardTitle: title,
            freeBoardContent: freeBoardContent
        };

        $.ajax({
            type: method,
            url: url,
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function (response) {
                fnInit();
                pf.seinfoAlert.success('[(#{seinfo.com.msg.00010})]', () => {
                    $('#modalFreeBoardReg').css('display', 'none');
                    window.location.reload();
                });
            },
            error: function (jqXHR) {
                fnInit();
                let response = JSON.parse(jqXHR.responseText).message;
                let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                pf.seinfoAlert.warning('[(#{seinfo.com.msg.00171})] <br> ' + msg, () => {
                    $('#modalFreeBoardReg').css('display', 'none');
                });
            }
        });
    }

    //초기화

        $("#modalFreeBoardTitle").val('');
        config.ckeditInstances['popupFreeBoardReg'].setData('');
        freeBoardModfiy = {};;
