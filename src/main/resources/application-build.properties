server.port=${SEINFO_PORT:8080}
server.domain=${SEINFO_PUBLIC_URL:https://www.seinfomation.com}
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8

#DBconnection
#spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SEINFO_DB_URL:jdbc:mysql://localhost:3306/seinfomationa_secure?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowMultiQueries=true}
spring.datasource.username=${SEINFO_DB_USER:SEINFOWAS}
spring.datasource.password=${SEINFO_DB_PASSWORD}

#Open Api
seinfo.openApi.company.url=https://api.odcloud.kr/api/nts-businessman/v1/validate?serviceKey=
seinfo.openApi.company.serviceKey=${SEINFO_COMPANY_API_KEY:}
seinfo.openApi.address.url=https://business.juso.go.kr/addrlink/addrLinkUrl.do
seinfo.openApi.address.confmKey=${SEINFO_ADDRESS_API_KEY:}

#SMTP Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SEINFO_SMTP_USER:}
spring.mail.password=${SEINFO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

server.type=${SEINFO_SERVER_TYPE:production}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
seinfo.security.max-upload-bytes=10000000
server.servlet.session.cookie.secure=true

seinfo.crypto.data-key=${SEINFO_DATA_KEY}
seinfo.crypto.lookup-key=${SEINFO_LOOKUP_KEY}

# Fixed 30 minute session lifetime matches DB token expiry.
