spring.application.name=seinfomationA

server.port=80
server.domain=${SEINFO_PUBLIC_URL:http://localhost}
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8

spring.banner.charset=UTF-8
spring.main.banner-mode=off

spring.jmx.enabled=false
spring.jpa.open-in-view=false
spring.main.allow-bean-definition-overriding=true

# DB connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SEINFO_DB_URL:jdbc:mysql://127.0.0.1:3307/seinfomationa_secure?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SEINFO_DB_USER:SEINFOWAS}
spring.datasource.password=${SEINFO_DB_PASSWORD}

spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.main.allow-circular-references=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
server.error.whitelabel.enabled=false

server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8

spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0

server.compression.enabled=true
server.compression.min-response-size=500
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

tus.server.data.directory=C:\\upload
tus.server.data.expiration=6000

spring.thymeleaf.enabled=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/views/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

#log4jdbc
logging.level.jdbc.sqlonly=off
logging.level.jdbc.sqltiming=off
logging.level.jdbc.resultsettable=off
logging.level.jdbc.audit=off
logging.level.jdbc.resultset=off
logging.level.jdbc.connection=off

#JWT
jwt.token.secret=${SEINFO_JWT_SECRET}
jwt.token.expiration.default=1800
jwt.token.expiration.autoLogin=1800

#User Id dup login check
service.dup.ipcheck=true

#Open Api
seinfo.openApi.company.url=https://api.odcloud.kr/api/nts-businessman/v1/validate?serviceKey=
seinfo.openApi.company.serviceKey=${SEINFO_COMPANY_API_KEY:}
seinfo.openApi.address.url=http://business.juso.go.kr/addrlink/addrLinkUrl.do
seinfo.openApi.address.confmKey=${SEINFO_ADDRESS_API_KEY:}

#SMTP Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SEINFO_SMTP_USER:}
spring.mail.password=${SEINFO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

server.type=${SEINFO_SERVER_TYPE:local}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
seinfo.security.max-upload-bytes=10000000

seinfo.crypto.data-key=${SEINFO_DATA_KEY}
seinfo.crypto.lookup-key=${SEINFO_LOOKUP_KEY}

logging.level.org.springframework.security.web.csrf=DEBUG

# Fixed 30 minute session lifetime matches DB token expiry.
