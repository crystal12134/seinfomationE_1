seinfo.intro.label.00110=\uC790\uC728\uC8FC\uD589\uC740 \uC6B4\uC804\uC790\uAC00 \uC9C1\uC811 \uC870\uC791\uD558\uC9C0 \uC54A\uC544\uB3C4 \uCC28\uB7C9\uC758 \uC678\uBD80 \uD658\uACBD \uBC0F \uC6B4\uC804\uC790 \uC0C1\uD0DC\uB97C \uC778\uC9C0\uD558\uACE0, <br>\uC778\uC9C0\uD55C \uC815\uBCF4\uB97C \uBC14\uD0D5\uC73C\uB85C \uD310\uB2E8\uD55C \uD6C4 \uCC28\uB7C9\uC744 \uC81C\uC5B4\uD574 \uC2A4\uC2A4\uB85C \uBAA9\uC801\uC9C0\uAE4C\uC9C0 \uC8FC\uD589\uD560 \uC218 \uC788\uAC8C \uB3C4\uC640\uC8FC\uB294 \uAE30\uC220\uC785\uB2C8\uB2E4.<br>\uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC740 \uC804\uD1B5\uC801\uC778 \uC790\uB3D9\uCC28 \uC81C\uC870\uC0AC \uBFD0\uB9CC \uC544\uB2C8\uB77C \uC138\uACC4 \uC720\uC218\uC758 \uAE30\uC5C5\uAE4C\uC9C0 \uC801\uADF9\uC801\uC73C\uB85C <br>\uAC1C\uBC1C\uC5D0 \uCC38\uC5EC\uD560 \uB9CC\uD07C \uBBF8\uB798 \uBAA8\uBE4C\uB9AC\uD2F0 \uAE30\uC220\uC758 \uD575\uC2EC\uC73C\uB85C \uC5EC\uACA8\uC9C0\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00120=\uBBF8\uAD6D\uC790\uB3D9\uCC28\uACF5\uD559\uD68C(Society of Automotive Engineers, SAE)\uB294 \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC744 \uC790\uB3D9\uD654 \uC218\uC900\uC5D0 \uB530\uB77C 6\uB2E8\uACC4(\uB808\uBCA8 0~\uB808\uBCA85)\uB85C \uBD84\uB958\uD569\uB2C8\uB2E4.<br> \uD604\uB300\uC790\uB3D9\uCC28\uB294 \uAC01 \uBD84\uC57C\uC5D0 \uAC15\uC810\uC744 \uC9C0\uB2CC \uAE30\uC5C5\uB4E4\uACFC \uC790\uC728\uC8FC\uD589 \uAE30\uC220 \uAC1C\uBC1C\uACFC \uAD00\uB828\uD55C \uD611\uC5C5\uC744 \uC9C4\uD589 \uC911\uC774\uBA70, <br>\u2018\uBCF4\uD3B8\uC801 \uC548\uC804\u2019\uACFC \u2018\uC120\uD0DD\uC801 \uD3B8\uC758\u2019\uB77C\uB294 \uCCA0\uD559\uC744 \uBC14\uD0D5\uC73C\uB85C \uBBF8\uB798 \uBAA8\uBE4C\uB9AC\uD2F0\uC758 \uC120\uB3C4\uC801\uC778 \uC81C\uACF5\uC744 \uC704\uD574 \uAD00\uB828 \uAE30\uC220\uC744 \uAC1C\uBC1C\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00130=\uD604\uB300\uC790\uB3D9\uCC28\uC758 \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC740 \uC8FC\uD589, \uC2B9\uD558\uCC28 \uBC0F \uC8FC\uCC28\uAE4C\uC9C0 \uC6B4\uC804\uC758 \uBAA8\uB4E0 \uACFC\uC815\uC5D0\uC11C <br>\uC548\uC804\uC744 \uB3C4\uBAA8\uD569\uB2C8\uB2E4
seinfo.intro.label.00140=\uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC774 \uC801\uC6A9\uB41C \uCC28\uB7C9\uC740 \uC8FC\uD589 \uC911 \uC2A4\uC2A4\uB85C \uC6B4\uC804 \uD658\uACBD\uC744 \uD310\uB2E8\uD558\uACE0, \uC704\uD5D8 \uC0C1\uD669\uC774 \uBC1C\uC0DD\uD558\uAC70\uB098 \uC0AC\uACE0\uAC00 \uC608\uC0C1\uB418\uBA74 \uC801\uADF9 \uAC1C\uC785\uD574 \uC548\uC804\uD55C \uC774\uB3D9\uC744 \uB3C4\uC640\uC90D\uB2C8\uB2E4. <br>\uB610\uD55C, \uC6B4\uC804\uC790\uC758 \uC758\uB3C4\uC5D0 \uB530\uB77C \uC9C0\uB8E8\uD558\uAC70\uB098 \uADC0\uCC2E\uC740 \uC6B4\uC804 \uC0C1\uD669\uC5D0\uC11C\uB294 \uC790\uB3D9\uD654\uB41C \uC2DC\uC2A4\uD15C\uC744 \uD1B5\uD574 \uC6B4\uC804\uC758 \uD53C\uB85C\uB3C4\uB97C \uC904\uC5EC\uC90D\uB2C8\uB2E4. <br>\uC774\uB97C \uC704\uD574 \uC8FC\uD589 \uC548\uC804, \uC8FC\uD589 \uD3B8\uC758, \uC8FC\uCC28 \uC548\uC804, \uC8FC\uCC28 \uD3B8\uC758\uB85C \uAD6C\uC131\uB41C \uC644\uC131\uB3C4 \uB192\uC740 \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC744 \uC81C\uACF5\uD569\uB2C8\uB2E4.<br><br>\uB610\uD55C, \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC758 \uC548\uC804\uC131\uC744 \uB192\uC774\uAE30 \uC704\uD574\uC11C \uAE30\uC874\uC5D0 \uC0DD\uAC01\uD558\uC9C0 \uBABB\uD588\uB358 \uBC94\uC704\uAE4C\uC9C0 \uB300\uBE44\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br><br>\uD604\uB300\uC790\uB3D9\uCC28\uB294 \uC5D0\uC5B4\uBC31\uACFC \uC2DC\uD2B8\uBCA8\uD2B8, ADAS(\uCCA8\uB2E8 \uC6B4\uC804\uC790 \uBCF4\uC870 \uC2DC\uC2A4\uD15C) \uB4F1 \uC9C1\uC811\uC801\uC778 \uC6B4\uC804 \uC0C1\uD669\uC5D0\uC11C \uBC1C\uC0DD\uD560 \uC218 \uC788\uB294 \uC0AC\uACE0\uB97C \uB9C9\uB294 \uAE30\uC220\uC740 \uBB3C\uB860,<br>\uC804\uBC29\uC704\uC801\uC73C\uB85C \uD0D1\uC2B9\uC790\uC640 \uBCF4\uD589\uC790\uB97C \uC7A0\uC7AC\uC801 \uC704\uD5D8\uC73C\uB85C \uBD80\uD130 \uBCF4\uD638\uD558\uAE30 \uC704\uD574 \uCCA8\uB2E8 \uC548\uC804 \uAE30\uC220\uC744 \uC120\uBCF4\uC774\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00150=\uD604\uB300\uC790\uB3D9\uCC28\uB294 \uD604\uC7AC \uC5EC\uB7EC \uB808\uBCA8\uC5D0 \uAC78\uCCD0 \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uB4E4\uC744 \uAC1C\uBC1C\uD558\uACE0 \uC801\uC6A9\uD574 \uB098\uAC00\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00160=2021\uB144\uC5D0\uB294 IAA \uBAA8\uBE4C\uB9AC\uD2F0\uC5D0\uC11C \uB808\uBCA8 4 \uC218\uC900\uC758 \uC544\uC774\uC624\uB2C9 5 \uC790\uC728\uC8FC\uD589\uCC28\uB97C \uACF5\uAC1C\uD588\uC2B5\uB2C8\uB2E4.<br>\uB85C\uBCF4\uD0DD\uC2DC(Robotaxi)\uB294 \uB85C\uBD07(robot)\uACFC \uD0DD\uC2DC(taxi)\uC758 \uD569\uC131\uC5B4\uB85C, \uC11C\uBE44\uC2A4 \uD50C\uB7AB\uD3FC\uC744 \uD1B5\uD574 \uD638\uCD9C\uD558\uB294 \uC790\uC728\uC8FC\uD589 \uC790\uB3D9\uCC28\uB97C \uC758\uBBF8\uD569\uB2C8\uB2E4.<br>\uAE30\uC874\uC758 \uD0DD\uC2DC\uC640 \uAC19\uC774 \uC2B9\uAC1D\uC774 \uC6D0\uD558\uB294 \uBAA9\uC801\uC9C0\uB85C \uC774\uB3D9\uC774 \uAC00\uB2A5\uD558\uBA70, \uB2E4\uC591\uD55C \uC8FC\uD589 \uC0C1\uD669\uC5D0 \uB300\uCC98\uD560 \uC218 \uC788\uB294 \uB808\uBCA84 \uC218\uC900\uC758 \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC744 \uAE30\uBC18\uC73C\uB85C \uD569\uB2C8\uB2E4.<br>\uD574\uB2F9 \uCC28\uB7C9\uC740 \uCE74\uBA54\uB77C, \uB808\uC774\uB354, \uB77C\uC774\uB2E4\uB85C \uC774\uB8E8\uC5B4\uC9C4 30\uAC1C \uC774\uC0C1\uC758 \uC13C\uC11C\uAC00 \uD0D1\uC7AC\uB418\uC5B4 \uC8FC\uBCC0 \uC0C1\uD669\uC5D0 \uB300\uD55C \uB370\uC774\uD130\uB97C \uC218\uC9D1\uD569\uB2C8\uB2E4.<br>\uC544\uC6B8\uB7EC \uD604\uB300\uC790\uB3D9\uCC28\uADF8\uB8F9\uC774 \uC571\uD2F0\uBE0C(Aptiv)\uC640 \uD568\uAED8 \uC138\uC6B4 \uBAA8\uC154\uB110(Motional)\uC744 \uD1B5\uD574 \uAC1C\uBC1C\uD55C \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC774 \uC801\uC6A9\uB3FC \uC548\uC804\uD558\uACE0 \uC2E0\uB8B0\uD560 \uC218 \uC788\uB294 \uC774\uB3D9 \uACBD\uD5D8\uC744 \uC81C\uACF5\uD569\uB2C8\uB2E4.<br>\uC544\uC774\uC624\uB2C9 5 \uC790\uC728\uC8FC\uD589\uCC28\uB294 \uB77C\uC2A4\uBCA0\uAC00\uC2A4 \uC2E4\uB3C4\uB85C\uC5D0\uC11C\uC758 \uC5C4\uACA9\uD55C \uD14C\uC2A4\uD2B8\uB97C \uAC70\uCCD0, \uD604\uC7AC \uC2B9\uAC1D \uB300\uC0C1\uC73C\uB85C \uC2DC\uBC94 \uC11C\uBE44\uC2A4\uB97C \uC6B4\uC601\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br>

seinfo.intro.label.00210=\uD604\uB300\uC790\uB3D9\uCC28\uB294 '\uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC911\uC2EC\uC758 \uC790\uB3D9\uCC28(SDV, Software Defined Vehicle)' \uAC1C\uBC1C \uCCB4\uC81C\uB85C\uC758 \uC804\uD658\uC744 \uAC00\uC18D\uD654\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00220=\uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC911\uC2EC\uC758 \uC790\uB3D9\uCC28 (SDV: Software Defined Vehicle)
seinfo.intro.label.00230=\uD604\uB300\uC790\uB3D9\uCC28\uB294 \uCC28\uC138\uB300 \uCC28\uB7C9 \uD50C\uB7AB\uD3FC\uACFC \uD1B5\uD569 \uC81C\uC5B4\uAE30, \uC790\uCCB4 \uAC1C\uBC1C \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uD50C\uB7AB\uD3FC\uC744 \uBC14\uD0D5\uC73C\uB85C<br>2025\uB144\uAE4C\uC9C0 \uAE00\uB85C\uBC8C \uC2DC\uC7A5\uC5D0\uC11C \uD310\uB9E4\uB418\uB294 \uBAA8\uB4E0 \uCC28\uC885\uC5D0 \uBB34\uC120(OTA, Over-the-Air)<br>\uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC5C5\uB370\uC774\uD2B8\uB97C \uAE30\uBCF8 \uC801\uC6A9\uD560 \uACC4\uD68D\uC785\uB2C8\uB2E4. \uC774\uC5D0 \uB530\uB77C \uACE0\uAC1D\uC740 \uC11C\uBE44\uC2A4\uC13C\uD130\uC5D0 \uC9C1\uC811 \uBC29\uBB38\uD558\uC9C0 \uC54A\uC544\uB3C4 \uC6D0\uD558\uB294 \uC2DC\uAC04\uACFC \uC7A5\uC18C\uC5D0\uC11C \uCC28\uB7C9\uC758 \uC131\uB2A5\uC744 \uAC1C\uC120\uD558\uACE0,<br>\uAC1C\uC778\uC758 \uB77C\uC774\uD504 \uC2A4\uD0C0\uC77C\uC5D0 \uB9DE\uB294 \uAE30\uB2A5\uC744 \uCC28\uB7C9\uC5D0 \uD0D1\uC7AC\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.<br>\uB610\uD55C, \uD604\uB300\uC790\uB3D9\uCC28\uADF8\uB8F9\uC758 \uAE00\uB85C\uBC8C \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC13C\uD130\uC778 \uD3EC\uD2F0\uD22C\uB2F7(42dot)\uC744 \uD1B5\uD574 \uBAA9\uC801\uAE30\uBC18 \uBAA8\uBE4C\uB9AC\uD2F0 (PBV, Purpose Built Vehicle)<br>\uB514\uBC14\uC774\uC2A4 \uBC0F \uC194\uB8E8\uC158 \uAC1C\uBC1C \uB4F1 \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC911\uC2EC\uC758 \uC2E0\uC131\uC7A5 \uB3D9\uB825\uC744 \uC9C0\uC18D\uC801\uC73C\uB85C \uB9C8\uB828\uD560 \uACC4\uD68D\uC785\uB2C8\uB2E4.
seinfo.intro.label.00240=\uC804\uAE30/\uC804\uC790 \uD1B5\uD569 \uC81C\uC5B4\uAE30\u00A0(Electrical/Electronic Systems)
seinfo.intro.label.00250=SDV\uB97C \uAD6C\uD604\uD558\uAE30 \uC704\uD574\uC11C, \uCC28\uB7C9\uC758 \uAC1C\uBC1C \uBCF5\uC7A1\uB3C4\uB97C \uB0AE\uCD98 \uC804\uAE30/\uC804\uC790 \uD1B5\uD569 \uC81C\uC5B4\uAE30\uAC00 \uD544\uC694\uD569\uB2C8\uB2E4.<br>\uC624\uB298\uB0A0 \uCC28\uB7C9\uC5D0\uC11C \uC0AC\uC6A9\uD558\uB294 \uC804\uAE30/\uC804\uC790 \uBD80\uD488 \uC218\uAC00 \uAE30\uD558\uAE09\uC218\uC801\uC73C\uB85C \uC99D\uAC00\uD558\uBA70 \uAC1C\uBC1C \uBCF5\uC7A1\uB3C4 \uC5ED\uC2DC \uC99D\uAC00\uD558\uC600\uC2B5\uB2C8\uB2E4.<br>\uD3ED\uBC1C\uC801\uC73C\uB85C \uC99D\uAC00\uD558\uB294 \uC804\uAE30/\uC804\uC790 \uBD80\uD488\uB4E4\uC744 \uBCF4\uB2E4 \uCCB4\uACC4\uC801\uC774\uACE0 \uD6A8\uC728\uC801\uC73C\uB85C \uAC1C\uBC1C\uD558\uAE30 \uC704\uD558\uC5EC, \uD604\uB300\uC790\uB3D9\uCC28\uB294 \uC911\uC7A5\uAE30 \uC804\uB7B5\uC5D0 \uBC1C\uB9DE\uCDB0 \uB2E8\uACC4\uC801\uC73C\uB85C \uC81C\uC5B4\uAE30\uB97C \uD1B5\uD569\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. <br>\uC774\uB97C \uD1B5\uD574 \uCC28\uB7C9 \uAC1C\uBC1C \uD6A8\uC728\uD654\uB97C \uB3C4\uBAA8\uD568\uACFC \uB3D9\uC2DC\uC5D0 \uC0C8\uB85C\uC6B4 \uAE30\uB2A5\uC744 \uCD94\uAC00\uD558\uAC70\uB098 \uC131\uB2A5\uC744 \uAC1C\uC120\uD558\uB294 \uC791\uC5C5\uB3C4 \uC190\uC27D\uAC8C \uD560 \uC218 \uC788\uB294 \uCCB4\uACC4\uB97C \uAC16\uCDC4\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00260=\uCC28\uB7C9\uC6A9 \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uD50C\uB7AB\uD3FC (Vehicle Software Platform)
seinfo.intro.label.00265=SDV \uC2DC\uB300\uB85C \uC804\uD658\uD558\uAE30 \uC704\uD574\uC11C\uB294, \uCC28\uB7C9\uC758 \uC218\uB9CE\uC740 \uC81C\uC5B4\uAE30\uC640 \uC13C\uC11C\uB4E4 \uADF8\uB9AC\uACE0 \uC678\uBD80\uC758 \uD074\uB77C\uC6B0\uB4DC\uB97C \uB3D9\uC2DC\uC5D0 \uC544\uC6B0\uB974\uB294 \uC720\uC5F0\uD558\uACE0 \uD45C\uC900\uD654\uB41C \uCC28\uB7C9\uC6A9 \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uD50C\uB7AB\uD3FC\uC740 \uD544\uC218\uC801\uC785\uB2C8\uB2E4.<br> \uD604\uB300\uC790\uB3D9\uCC28\uB294 \uC6B4\uC804\uC790\uC640 \uCC28\uB7C9\uC744 \uC5F0\uACB0\uD558\uB294 \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uD50C\uB7AB\uD3FC\uC744 \uAC1C\uBC1C\uD558\uC600\uACE0 \uC774\uB294 \uCC28\uB7C9\uC758 \uD558\uB4DC\uC6E8\uC5B4 \uC131\uB2A5\uC744 \uCD5C\uB300\uD654\uD558\uBA74\uC11C\uB3C4 \uC720\uC5F0\uD558\uAC8C \uC5EC\uB7EC \uC2E0\uAE30\uB2A5\uC744 \uD655\uC7A5\uD560 \uC218 \uC788\uB294 \uD45C\uC900\uD654\uB41C \uAD6C\uC870\uC785\uB2C8\uB2E4.<br>\uC774\uB97C \uD1B5\uD574 \uC2A4\uB9C8\uD2B8\uD3F0\uACFC \uC2A4\uB9C8\uD2B8\uD648 \uC5F0\uACC4 \uC11C\uBE44\uC2A4, \uC9C0\uB2A5\uD615 \uC6D0\uACA9 \uC9C0\uC6D0, \uC2A4\uB9C8\uD2B8 \uD2B8\uB798\uD53D (Smart Traffic) \uB4F1 \uB2E4\uC591\uD55C \uC11C\uBE44\uC2A4\uC758 \uD655\uC7A5\uACFC \uACE0\uB3C4\uD654\uAC00 \uAC00\uB2A5\uD569\uB2C8\uB2E4.
seinfo.intro.label.00270=\uD074\uB77C\uC6B0\uB4DC (Cloud Technology)
seinfo.intro.label.00280=\uD074\uB77C\uC6B0\uB4DC\uB294 \uCC28\uB7C9\uC5D0\uC11C \uC2E4\uC2DC\uAC04\uC73C\uB85C \uC0DD\uC131\uB418\uB294 \uBC29\uB300\uD55C \uC591\uC758 \uB370\uC774\uD130\uB97C \uC218\uC9D1 \uBC0F \uBD84\uC11D\uD558\uACE0, \uCC28\uB7C9\uACFC \uD1B5\uC2E0\uD558\uC5EC \uB370\uC774\uD130\uC640 \uC11C\uBE44\uC2A4\uB97C \uC548\uC815\uC801\uC73C\uB85C \uC81C\uACF5\uD558\uB294 \uC5ED\uD560\uC744 \uB2F4\uB2F9\uD569\uB2C8\uB2E4.<br>\uD2B9\uD788, \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uC744 \uACE0\uB3C4\uD654\uD558\uAE30 \uC704\uD574\uC11C\uB294 \uCC28\uB7C9\uACFC \uC2E4\uC2DC\uAC04\uC73C\uB85C \uC18C\uD1B5\uD574\uC57C \uD558\uAE30 \uB54C\uBB38\uC5D0 Car-to-Cloud\uC758 \uC911\uC694\uC131\uC740 \uC9C0\uC18D\uC801\uC73C\uB85C \uC99D\uAC00\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br>\uD604\uB300\uC790\uB3D9\uCC28\uADF8\uB8F9\uC740 \uC790\uCCB4 \uAC1C\uBC1C\uD55C \uD074\uB77C\uC6B0\uB4DC \uD50C\uB7AB\uD3FC\uC744 \uAE30\uBC18\uC73C\uB85C \uAD6D\uB0B4, \uBBF8\uAD6D, \uC720\uB7FD \uB4F1\uC758 \uC804 \uC138\uACC4 \uC8FC\uC694 \uAC70\uC810\uC5D0 \uB370\uC774\uD130 \uC13C\uD130\uB97C \uAD6C\uCD95\uD558\uC600\uACE0 \uC55E\uC73C\uB85C \uACC4\uC18D\uD574\uC11C \uD655\uB300\uD560 \uC608\uC815\uC785\uB2C8\uB2E4. <br>\uC774\uB97C \uD1B5\uD574 \uC804 \uC138\uACC4 \uC218\uCC9C\uB9CC \uB300\uC758 SDV\uAC00 \uC0DD\uC131\uD558\uB294 \uAD50\uD1B5\uC2E0\uD638, \uCC28\uB7C9 \uC13C\uC11C \uC815\uBCF4, \uC6B4\uD589 \uC815\uBCF4 \uB4F1 \uB300\uB7C9\uC758 \uB370\uC774\uD130\uB97C \uD559\uC2B5\uD558\uC5EC \uACE0\uAC1D\uC5D0\uAC8C \uBCF4\uB2E4 \uC548\uC804\uD55C \uC790\uC728\uC8FC\uD589 \uAE30\uC220\uACFC \uD3B8\uB9AC\uD55C \uC774\uB3D9 \uACBD\uD5D8\uC744 \uC81C\uACF5\uD560 \uACC4\uD68D\uC785\uB2C8\uB2E4.
seinfo.intro.label.00290=\uCEE4\uB125\uD2F0\uB4DC \uC11C\uBE44\uC2A4 (Connected Services)
seinfo.intro.label.00295=\uD604\uB300\uC790\uB3D9\uCC28\uAC00 \uC9C0\uD5A5\uD558\uB294 SDV (Software Defined Vehicle)\uB294 \uC0C8\uB85C\uC6B4 \uCEE4\uB125\uD2F0\uB4DC \uC11C\uBE44\uC2A4\uB97C \uB04A\uC784\uC5C6\uC774 \uC0DD\uC131\uD558\uACE0 \uACF5\uAE09\uD558\uC5EC \uACE0\uAC1D\uB4E4\uC774 \uC5B8\uC81C\uB098 \uC0C8\uB85C\uC6B4 \uAC00\uCE58\uB97C \uACBD\uD5D8\uD560 \uC218 \uC788\uB294 \uCC28\uB7C9\uC785\uB2C8\uB2E4.<br> \uD604\uB300\uC758 SDV\uB294 \uCC28\uB7C9\uACFC \uC2A4\uB9C8\uD2B8 \uAE30\uAE30, \uAD50\uD1B5 \uC778\uD504\uB77C\uB97C \uD558\uB098\uB85C \uC5F0\uACB0\uD55C \uB2E4\uC591\uD55C \uC11C\uBE44\uC2A4\uB97C \uC81C\uACF5\uD569\uB2C8\uB2E4.<br>\uB514\uC9C0\uD138 \uD0A4\uB97C \uD65C\uC6A9\uD574 \uBCF8\uC778\uC758 \uC2A4\uB9C8\uD2B8 \uAE30\uAE30\uB9CC\uC73C\uB85C \uCC28\uB7C9\uC5D0 \uD0D1\uC2B9\uD560 \uC218 \uC788\uACE0, \uC2E4\uC2DC\uAC04 \uC218\uC9D1\uB418\uACE0 \uC788\uB294 \uC775\uBA85\uD654\uB41C \uB370\uC774\uD130\uC640 AI \uC54C\uACE0\uB9AC\uC998\uC73C\uB85C \uC2DC\uC2DC\uAC01\uAC01 \uBCC0\uD558\uB294 \uB3C4\uB85C \uC0C1\uD669\uC744 \uC815\uD655\uD558\uAC8C \uBD84\uC11D\uD558\uC5EC \uACBD\uB85C\uB97C \uC548\uB0B4\uD569\uB2C8\uB2E4.<br> \uD604\uB300\uC790\uB3D9\uCC28\uB294 \uC774\uB7EC\uD55C \uCEE4\uB125\uD2F0\uB4DC \uC11C\uBE44\uC2A4\uB4E4\uC744 \uC9C0\uC18D\uC801\uC73C\uB85C \uBC1C\uC804\uC2DC\uCF1C \uACE0\uAC1D\uB4E4\uC5D0\uAC8C \uBCF4\uB2E4 \u2018\uC548\uC804\uD558\uACE0 \uC790\uC720\uB85C\uC6B4 \uC774\uB3D9\uACFC \uD3C9\uD654\uB85C\uC6B4 \uC0B6\u2019\uC758 \uAC00\uCE58\uB97C \uC804\uB2EC\uD560 \uAC83\uC785\uB2C8\uB2E4.

seinfo.intro.label.00310=\uB85C\uBCF4\uD2F1\uC2A4\uB294 \uB85C\uBD07\uACFC \uAE30\uC220\uC758 \uD569\uC131\uC5B4\uB85C \uB85C\uBD07\uC744 \uC2E4\uC0DD\uD65C\uC5D0 \uB3C4\uC785\uD574 \uD3B8\uB9AC\uD55C \uC0B6\uC744 \uB3C4\uBAA8\uD558\uB294 \uAE30\uC220\uC744 \uB9D0\uD569\uB2C8\uB2E4. \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220\uB85C \uAE4A\uC740 \uBC14\uB2E4, \uC790\uC5F0 \uC7AC\uD574 \uC9C0\uC5ED, \uC624\uC5FC\uB41C \uD658\uACBD \uB4F1 \uC778\uAC04\uC774 \uB3C4\uB2EC\uD558\uAE30 \uC5B4\uB824\uC6E0\uB358 \uC704\uD5D8\uD55C \uC7A5\uC18C\uAE4C\uC9C0 \uC6B0\uB9AC \uC778\uB958\uC758 \uC601\uC5ED\uC744 \uD655\uC7A5\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uC2E4\uC81C\uB85C \uD604\uB300\uC790\uB3D9\uCC28 \uADF8\uB8F9\uC758 SPOT\uC740 \uCCB4\uB974\uB178\uBE4C\uC5D0 \uBCF4\uB0B4\uC84C\uACE0 \uC774\uB294 \uC778\uAC04\uACFC \uB85C\uBD07\uC774 \uC2DC\uB108\uC9C0\uB97C \uBC1C\uD718\uD558\uB294 \uADF8 \uC2DC\uC791\uC744 \uC54C\uB9AC\uAE30\uB3C4 \uD588\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00320=\uD604\uB300\uC790\uB3D9\uCC28 \uB85C\uBCF4\uD2F1\uC2A4 \uBE44\uC804 : \uB85C\uBD07\uC9C0\uB2A5\uC0AC\uD68C
seinfo.intro.label.00330=\uD604\uB300\uC790\uB3D9\uCC28\uADF8\uB8F9\uC740 10\uC5EC\uB144 \uC804\uBD80\uD130 \uB85C\uBCF4\uD2F1\uC2A4 \uC5F0\uAD6C\uAC1C\uBC1C\uC744 \uC2DC\uC791\uD558\uC5EC 2019\uB144 \uB85C\uBCF4\uD2F1\uC2A4\uB7A9\uC744 \uC2E0\uC124\uD558\uBA70 \uBBF8\uB798 \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220 \uAC1C\uBC1C\uC744 \uBCF8\uACA9\uD654 \uD558\uC600\uC2B5\uB2C8\uB2E4.<br>2021\uB144\uC5D0\uB294 \uBCF4\uC2A4\uD134 \uB2E4\uC774\uB0B4\uBBF9\uC2A4\uC758 \uC778\uC218\uB97C \uD1B5\uD574 \uBBF8\uB798 \uBAA8\uBE4C\uB9AC\uD2F0\uC5D0 \uAD00\uD55C \uAD6C\uC0C1\uC744 \uD1B5\uD569\uD558\uACE0 \uD655\uC7A5 \uD558\uC600\uC2B5\uB2C8\uB2E4.<br><br>\uB2F9\uC0AC\uB294 \uB85C\uBCF4\uD2F1\uC2A4 \uC120\uD589\uAE30\uC220\uC774 \uB0B4\uC7AC\uD654\uB41C \uD558\uB4DC\uC6E8\uC5B4\uC640 \uC18C\uD504\uD2B8\uC6E8\uC5B4\uB97C \uAE30\uBC18\uC73C\uB85C, \uBB3C\uB958, \uC11C\uBE44\uC2A4, \uC548\uC804 \uB4F1 \uB2E4\uC591\uD55C \uBD84\uC57C\uC5D0\uC11C \uD65C\uC6A9\uD560 \uC218 \uC788\uB294 \uB85C\uBD07\uACFC \uC11C\uBE44\uC2A4\uB97C \uAC1C\uBC1C\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br>\uC774\uB7EC\uD55C \uC720\uAE30\uC801\uC778 \uD601\uC2E0 \uAE30\uBC18\uC73C\uB85C \uC774\uB8E8\uC5B4 \uC9C8 \uB85C\uBD07\uC9C0\uB2A5\uC0AC\uD68C\uB294 \uC0AC\uB78C\uB4E4\uC744 \uB354 \uB098\uC740 \uC0B6\uC73C\uB85C \uC548\uB0B4\uD560 \uAC83\uC785\uB2C8\uB2E4.
seinfo.intro.label.00340=\uD48D\uC694\uB85C\uC6B4 \uC0B6\uC73C\uB85C \uC774\uB044\uB294 \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220
seinfo.intro.label.00350=\uD604\uB300\uC790\uB3D9\uCC28\uB294 \uD604\uC7AC \uCC29\uC6A9\uD615 \uB85C\uBD07\uC5D0\uC11C \uC11C\uBE44\uC2A4\uD615 \uB85C\uBD07, \uBAA8\uBC14\uC77C \uB85C\uBD07\uAE4C\uC9C0 \uAC1C\uBC1C\uD558\uC5EC \uACF5\uAC1C\uD588\uC2B5\uB2C8\uB2E4. \uC0B0\uC5C5\uC6A9 \uCC29\uC6A9\uB85C\uBD07 CEX (Chairless Exoskeleton) \uC640 VEX (Vest Exoskeleton) \uB294 \uC778\uAC04\uC758 \uD798\uC744 \uBCF4\uC870\uD558\uB294 \uC5ED\uD560\uC744 \uD558\uACE0, \uC758\uB8CC\uC6A9 \uCC29\uC6A9\uB85C\uBD07 \uC5D1\uC2A4\uBE14 \uB9E5\uC2A4 (X-ble MEX : X-ble Medical Exoskeleton) \uB294 \uD558\uC9C0\uB9C8\uBE44 \uD658\uC790\uC758 \uC7AC\uD65C\uC744 \uB3C4\uC6B0\uBA70 \uC2E0\uCCB4\uC758 \uD55C\uACC4\uB97C \uBCF4\uC644\uD569\uB2C8\uB2E4.<br><br>\uC11C\uBE44\uC2A4\uD615 \uB85C\uBD07 \uBD84\uC57C\uC5D0\uC11C\uB294 \uACE0\uAC1D \uC751\uB300 \uC11C\uBE44\uC2A4\uD615 \uB85C\uBD07\uC778 DAL-e, \uC804\uAE30\uCC28 \uC790\uB3D9\uCDA9\uC804 \uB85C\uBD07 ACR, AI\uAE30\uBC18 \uBC30\uC1A1\uB85C\uBD07\uC774 \uC788\uC73C\uBA70, 2022\uB144\uC5D0\uB294 \uC2E0\uAC1C\uB150 \uBAA8\uBC14\uC77C \uD50C\uB7AB\uD3FC \uBAA8\uBCA0\uB4DC(MobED)\uB97C \uAC1C\uBC1C\uD558\uC5EC \uACF5\uAC1C\uD588\uC2B5\uB2C8\uB2E4.<br><br>\uB354 \uC790\uC138\uD55C \uB85C\uBCF4\uD2F1\uC2A4 \uC815\uBCF4\uB294 
seinfo.intro.label.00351=\uC5EC\uAE30
seinfo.intro.label.00352=\uB97C \uD074\uB9AD\uD558\uC5EC \uD655\uC778\uD558\uC138\uC694.
seinfo.intro.label.00360=\uBAA8\uB4E0 \uC0AC\uBB3C\uC5D0 \uC774\uB3D9\uC131\uC744 \uBD80\uC5EC\uD558\uB294 \uD604\uB300\uC790\uB3D9\uCC28 \uB85C\uBCF4\uD2F1\uC2A4
seinfo.intro.label.00365=\uD604\uB300\uC790\uB3D9\uCC28\uB294 2022\uB144 CES\uB97C \uD1B5\uD574 \uBAA8\uB4E0 \uC0AC\uBB3C\uC5D0 \uC774\uB3D9\uC131\uC744 \uBD80\uC5EC\uD558\uB294 \uB85C\uBD07\uC778 PnD (Plug & Drive Module)\uC640 \uC2E0\uAC1C\uB150 \uBAA8\uBE4C\uB9AC\uD2F0\uC778 MobED\uB97C \uBC1C\uD45C\uD588\uC2B5\uB2C8\uB2E4.<br><br>PnD \uBAA8\uB4C8 (Plug & Drive) \uC740 \uC9C0\uB2A5\uD615 \uC2A4\uD2F0\uC5B4\uB9C1, \uBE0C\uB808\uC774\uD06C, \uD720 \uD0D1\uC7AC\uC2DD \uC804\uAE30 \uAD6C\uB3D9 \uBC0F \uC11C\uC2A4\uD39C\uC158 \uD558\uB4DC\uC6E8\uC5B4\uAC00 \uD3EC\uD568\uB41C \uC77C\uCCB4\uD615 \uC194\uB8E8\uC158\uC73C\uB85C \uBAA8\uB4E0 \uAE30\uB2A5\uC774 \uB2E8\uC77C \uD720 \uC720\uB2DB\uC5D0 \uD0D1\uC7AC\uB429\uB2C8\uB2E4. \uD2B9\uBCC4\uD55C \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220\uC774 \uC801\uC6A9\uB41C \uC774 \uD720\uC740 \uC6B0\uB9AC\uAC00 \uBBF8\uB798\uC5D0 \uBC14\uD034\uB97C \uC0AC\uC6A9\uD560 \uC218 \uC788\uB294 \uBC29\uC2DD \uC790\uCCB4\uB97C \uC7AC\uCC3D\uC870\uD55C \uAC83\uC785\uB2C8\uB2E4. \uC774 \uBAA8\uB4C8\uC740 \uC790\uC720\uB86D\uAC8C \uD68C\uC804\uD558\uBA70 \uB9E4\uC6B0 \uC720\uC5F0\uD558\uAC8C \uC6C0\uC9C1\uC77C \uC218 \uC788\uC73C\uBA70, LiDAR\uC640 \uCE74\uBA54\uB77C \uC13C\uC11C\uB97C \uD1B5\uD574 \uC8FC\uBCC0 \uD658\uACBD\uC744 \uC2E4\uC2DC\uAC04\uC73C\uB85C \uC778\uC9C0, \uC6C0\uC9C1\uC784\uC5D0 \uBC18\uC601\uD569\uB2C8\uB2E4. \uC774 \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220\uC758 \uD575\uC2EC \uC544\uC774\uB514\uC5B4\uB294 \u2018\uC6C0\uC9C1\uC77C \uC218 \uC5C6\uB358 \uBB3C\uCCB4\uC5D0 \uC774\uB3D9\uC131\uC744 \uBD80\uC5EC\uD558\uB294 \uAC83\u2019\uC73C\uB85C, \uC791\uC740 \uBB3C\uCCB4\uBD80\uD130 \uD070 \uC2DC\uC124\uC5D0 \uC774\uB974\uAE30\uAE4C\uC9C0, PnD \uBAA8\uB4C8\uC744 \uD1B5\uD574 \uBAA8\uB4E0 \uAC83\uC5D0 \uC6C0\uC9C1\uC784\uC774 \uBD80\uC5EC\uB41C\uB2E4\uBA74 \uAC1C\uC778\uACFC \uC0AC\uD68C\uC758 \uB2C8\uC988\uB97C \uB354\uC6B1 \uCDA9\uC871\uC2DC\uD0AC \uC218 \uC788\uC744 \uAC83\uC785\uB2C8\uB2E4.
seinfo.intro.label.00370=MobED : \uC774\uB3D9\uC758 \uD55C\uACC4\uB97C \uADF9\uBCF5\uD558\uB294 \uC2E0\uAC1C\uB150 \uBAA8\uBE4C\uB9AC\uD2F0
seinfo.intro.label.00375=MobED\uC5D0\uB294 DnL \uBAA8\uB4C8\uC774 \uC801\uC6A9\uB418\uC5B4 \uAC01 \uBC14\uD034\uC5D0 \uAD6C\uB3D9, \uC870\uD5A5, \uBE0C\uB808\uC774\uD06C\uB97C \uD558\uB098\uC758 \uAD6C\uC870\uB85C \uACB0\uD569\uD55C \uC77C\uCCB4\uD615 \uC194\uB8E8\uC158\uC73C\uB85C \uC790\uC138\uC81C\uC5B4 \uC2DC\uC2A4\uD15C\uC5D0 \uC758\uD574 \uB178\uBA74\uC758 \uC0C1\uD0DC\uC5D0 \uB530\uB77C \uCD5C\uC801\uC758 \uC790\uC138\uB97C \uCDE8\uD558\uB3C4\uB85D \uC81C\uC5B4\uD569\uB2C8\uB2E4. \uBAB8\uCCB4\uC758 \uB192\uB0AE\uC774\uC640 \uAE30\uC6B8\uAE30\uB97C \uC790\uC720\uC790\uC7AC\uB85C \uC870\uC808\uD560 \uC218 \uC788\uC73C\uBA70, \uACC4\uB2E8 \uD615\uD0DC\uC758 \uC9C0\uBA74\uB3C4 \uD754\uB4E4\uB9BC \uC5C6\uC774 \uC624\uB974\uB0B4\uB9B4 \uC218 \uC788\uC5B4 \uD3C9\uC9C0\uB85C \uC81C\uD55C\uB418\uC5C8\uB358 \uC774\uB3D9\uC758 \uD55C\uACC4\uB97C \uADF9\uBCF5\uD558\uBA74\uC11C\uB3C4 \uD0D1\uC2B9\uC790\uC640 \uC801\uC7AC\uBB3C\uC744 \uBCF4\uD638\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.<br><br>MobED\uB294 \uD558\uB098\uC758 \uD50C\uB7AB\uD3FC\uC73C\uB85C\uC368 \uD0D1\uC7AC\uB418\uB294 \uC5B4\uD50C\uB9AC\uCF00\uC774\uC158\uC5D0 \uB530\uB77C \uCD2C\uC601\uC744 \uBCF4\uC870\uD558\uAC70\uB098 \uC9D0\uC744 \uC62E\uAE38 \uC218\uB3C4 \uC788\uACE0 \uADF8 \uC678 \uB2E4\uC591\uD55C \uC6A9\uB3C4\uB85C \uD65C\uC6A9 \uAC00\uB2A5\uD55C \uBA40\uD2F0 \uD50C\uB7AB\uD3FC\uC785\uB2C8\uB2E4.
seinfo.intro.label.00380=\uC778\uAC04\uC758 \uC7A0\uC7AC\uB825\uC744 \uB118\uC5B4\uC11C\uB2E4.
seinfo.intro.label.00385=\uD604\uB300\uC790\uB3D9\uCC28\uC758 \uB85C\uBCF4\uD2F1\uC2A4 \uBE44\uC804\uC740 \uC778\uB958\uC758 \uC5ED\uB7C9\uC744 \uD655\uB300\uD558\uB294 \uAC83\uC5D0\uB9CC \uBA38\uBB34\uB974\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uBAA8\uB4E0 \uC0AC\uBB3C\uC774 \uC81C\uD55C\uC5C6\uC774 \uC6C0\uC9C1\uC77C \uC218 \uC788\uB294 \uBBF8\uB798 \uC989 MoT* \uC0DD\uD0DC\uACC4\uB97C \uAD6C\uCD95\uD558\uB294 \uAC83\uC785\uB2C8\uB2E4.<br> \uBAA8\uBE4C\uB9AC\uD2F0 \uAE30\uC5C5\uC73C\uB85C\uC11C \uC778\uB958\uC758 \uC601\uC5ED\uC744 \uB113\uD788\uAE30 \uC704\uD574 \uB3C4\uC804\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br><br>*MoT (Mobility of Things) \uC0DD\uD0DC\uACC4 : \uB85C\uBCF4\uD2F1\uC2A4 \uAE30\uC220 \uAE30\uBC18 \uC0AC\uC6A9\uC790\uAC00 \uC6D0\uD558\uB294 \uACF5\uAC04\uACFC \uD544\uC694\uD55C \uC21C\uAC04\uC744 \uC9C0\uC815\uD558\uACE0 \uC0AC\uBB3C\uC5D0 \uC774\uB3D9\uC131\uC744 \uBD80\uC5EC\uD574 \uB3C4\uC2DC \uC548\uC5D0\uC11C Mobile Connector\uB85C\uC368 \uC0C8\uB85C\uC6B4 \uC21C\uD658\uC801 \uC774\uB3D9\uC131\uC744 \uB9CC\uB4DC\uB294 \uBBF8\uB798 \uBAA8\uBE4C\uB9AC\uD2F0 \uC0DD\uD0DC\uACC4.

seinfo.intro.label.00410=AAM\uC774\uB780 Advanced Air Mobility\uC758 \uC57D\uC790\uB85C \uD601\uC2E0\uC801\uC778 \uBBF8\uB798 \uD56D\uACF5\uC774\uB3D9 \uC218\uB2E8\uC785\uB2C8\uB2E4. \uBA54\uAC00\uC2DC\uD2F0\uB85C \uB300\uD45C\uB418\uB294 \uBBF8\uB798 \uB300\uB3C4\uC2DC\uC758 \uADF9\uC2EC\uD55C \uAD50\uD1B5 \uD63C\uC7A1\uC744 \uD574\uACB0\uD558\uAE30 \uC704\uD55C \uD574\uACB0\uCC45\uC73C\uB85C \uB4F1\uC7A5\uD588\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00420=2020\uB144 CES\uC5D0\uC11C\uB294 \uCCAB \uBE44\uC804 \uCF58\uC149\uD2B8 S-A1 \uACF5\uAC1C \uD6C4, \uC138\uACC4 2\uB300 \uC5D0\uC5B4\uC1FC\uC911 \uD558\uB098\uC778 \uC601\uAD6D \uD310\uBC84\uB7EC \uAD6D\uC81C \uC5D0\uC5B4\uC1FC(Farnborough International Airshow)\uC5D0\uC11C\uB294 \uC790\uB3D9\uCC28 \uB0B4\uC7A5 \uB514\uC790\uC778 \uC694\uC18C\uB97C \uC801\uC6A9\uD55C \uC778\uD14C\uB9AC\uC5B4 \uCE90\uBE48 \uCF58\uC149\uD2B8\uB97C \uC120\uBCF4\uC600\uC73C\uBA70, 2024 CES\uC5D0\uC11C\uB294 \uC9C4\uD654\uB41C \uCF58\uC149\uD2B8 \uBAA8\uB378 S-A2\uACFC \uD601\uC2E0\uC801\uC778 \uD2F8\uD2B8 \uB85C\uD130 \uBC29\uC2DD\uC744 \uD1B5\uD574 \uD6A8\uC728\uC131\uACFC \uC548\uC804\uC131\uC744 \uADF9\uB300\uD654 \uD588\uC2B5\uB2C8\uB2E4.<br><br>Smart Mobility Solution Provider\uB85C\uC758 \uD604\uB300\uC790\uB3D9\uCC28 \uADF8\uB8F9\uC740 \uC6D0\uD65C\uD558\uAC8C \uD1B5\uD569\uB41C \uBCF5\uD569 \uC6B4\uC1A1 \uBAA8\uBE4C\uB9AC\uD2F0 \uC194\uB8E8\uC158\uC744 \uC81C\uACF5\uD558\uB294 \uAC83\uC744 \uBAA9\uD45C\uB85C \uBAA8\uBE4C\uB9AC\uD2F0\uB97C \uB2E4\uC74C \uCC28\uC6D0\uC73C\uB85C \uB04C\uC5B4\uC62C\uB9B4 \uAC83\uC785\uB2C8\uB2E4. \uC288\uD37C\uB110\uC740 \uAC10\uD56D\uC778\uC99D \uD655\uBCF4 \uBC0F \uB300\uB7C9\uC0DD\uC0B0\uC744 \uC704\uD574 \uC9C0\uC18D\uC801\uC73C\uB85C \uC5EC\uB7EC \uD615\uD0DC\uC758 \uAE30\uC220 \uC2DC\uC81C\uAE30(Tech Demonstrator) \uBC0F \uBE44\uD589 \uD14C\uC2A4\uD2B8\uB97C \uC2E4\uC2DC\uD558\uB294 \uB3D9\uC2DC\uC5D0, \uB2E4\uC591\uD55C \uD30C\uD2B8\uB108\uC640 \uD611\uC5C5\uD558\uC5EC AAM \uC804\uBC18\uC5D0 \uAC78\uCE5C \uC0DD\uD0DC\uACC4 \uAD6C\uCD95\uC744 \uC120\uB3C4\uD558\uACE0 \uC5F0\uAD00 \uC0AC\uC5C5 \uC9C4\uCD9C\uC744 \uC900\uBE44\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.<br><br>\uD604\uB300\uCC28\uB294 AAM \uC2DC\uC7A5\uC744 \uAC1C\uCC99\uD558\uAE30 \uC704\uD574 \uBC30\uD130\uB9AC, \uB85C\uBCF4\uD2F1\uC2A4 \uB4F1 \uADF8\uB8F9\uC0AC\uC758 \uAE30\uC220 \uC5ED\uB7C9\uC744 \uACB0\uC9D1\uD558\uACE0, \uAE00\uB85C\uBC8C \uD56D\uACF5 \uC0B0\uC5C5 \uD0D1\uD2F0\uC5B4 \uD30C\uD2B8\uB108\uC640\uB3C4 \uC9C0\uC18D \uC81C\uD734\uD558\uBA70 AAM \uC0C1\uC6A9\uD654 \uAE30\uBC18\uC744 \uB9C8\uB828\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.

seinfo.intro.label.00510=PBV(Purpose Built Vehicle : \uBAA9\uC801\uAE30\uBC18 \uBAA8\uBE4C\uB9AC\uD2F0)\uB294 \uBAA8\uB4E0 \uC0B6\uC758 \uBC29\uC2DD\uC744 \uC218\uC6A9\uD558\uB294 \uC804\uB3D9\uD654 \uAE30\uBC18\uC758 \uBAA8\uB4C8\uD615 \uBAA8\uBE4C\uB9AC\uD2F0 \uC785\uB2C8\uB2E4. \uC0AC\uC6A9 \uBAA9\uC801\uC744 \uC911\uC2EC\uC73C\uB85C \uC124\uACC4, \uB514\uC790\uC778\uB41C PBV\uB294 \uD0D1\uC2B9\uAC1D\uC774 \uBAA9\uC801\uC9C0\uAE4C\uC9C0 \uD5A5\uD558\uB294 \uB3D9\uC548 \uAD50\uC721\uC774\uB098 \uD5EC\uC2A4\uCF00\uC5B4, \uC5D4\uD130\uD14C\uC778\uBA3C\uD2B8 \uB4F1 \uC790\uC2E0\uC5D0\uAC8C \uD544\uC694\uD55C \uB9DE\uCDA4\uD615 \uC11C\uBE44\uC2A4\uB97C \uC790\uC720\uB86D\uAC8C \uB204\uB9B4 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC6A9\uB3C4\uC5D0 \uB530\uB77C\uC11C\uB294 \uCE74\uD398, \uC2DD\uB2F9, \uBCD1\uC6D0 \uB4F1\uC758 \uC2DC\uC124\uB85C\uB3C4 \uBCC0\uC2E0 \uAC00\uB2A5\uD569\uB2C8\uB2E4. \uBC14\uD034\uB2EC\uB9B0 \uACF5\uAC04\uC778 PBV\uB97C \uD1B5\uD574 \uC790\uB3D9\uCC28\uB294 \uB2E8\uC21C\uD55C \uC774\uB3D9\uC218\uB2E8\uC744 \uB118\uC5B4 \u2018\uC0B6\uC758 \uACF5\uAC04\u2019\uC774 \uB420 \uAC83\uC785\uB2C8\uB2E4.
seinfo.intro.label.00520=PBV- UAM: \uB3C4\uC2DC \uC0DD\uD65C \uACF5\uAC04\uC758 \uBCC0\uD654
seinfo.intro.label.00530=PBV\uB9CC\uC73C\uB85C\uB3C4 \uD6CC\uB96D\uD55C \uC0B6\uC758 \uACF5\uAC04\uC774 \uB420 \uC218 \uC788\uC9C0\uB9CC, UAM(\uB3C4\uC2EC\uD56D\uACF5 \uBAA8\uBE4C\uB9AC\uD2F0)\uACFC \uB9CC\uB098\uBA74 \uB3C4\uC2DC\uB97C \uC720\uAE30\uC801\uC73C\uB85C \uD65C\uC131\uD654 \uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. PBV\uC640 UAM\uC774 \uB9CC\uB098\uB294 hub(\uD5C8\uBE0C)\uB294 \uC0AC\uB78C\uB4E4\uC774 \uB2E4\uC591\uD55C \uBC29\uC2DD\uC73C\uB85C \uAD50\uB958\uD558\uACE0 \uC0C8\uB85C\uC6B4 \uAC00\uCE58\uB97C \uB204\uB9B4 \uC218 \uC788\uB294 \uACF5\uAC04\uC73C\uB85C \uACF5\uD56D\uC774\uB098 \uD130\uBBF8\uB110\uACFC \uAC19\uC740 \uC5ED\uD560\uC744 \uC218\uD589\uD558\uC9C0\uB9CC \uD544\uC694\uC5D0 \uB530\uB77C \uAE30\uB2A5\uC774\uB098 \uD615\uD0DC\uB294 \uBCC0\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uD604\uB300\uC790\uB3D9\uCC28\uB294 \uADFC\uBCF8\uC801\uC778 \uC0B6\uC758 \uBC29\uC2DD\uC744 \uBCC0\uD654\uC2DC\uD0A4\uBA70, \uC8FC\uAC70 \uC704\uAE30\uB098 \uAD50\uD1B5 \uCCB4\uC99D\uACFC \uAC19\uC740 \uB2E4\uC591\uD55C \uBB38\uC81C\uB97C \uD574\uACB0\uD558\uB294 \uBBF8\uB798\uC758 \uB3C4\uC2DC \uC0DD\uD65C \uD50C\uB7AB\uD3FC\uC744 \uB9CC\uB4E4\uAE30 \uC704\uD574 \uC9C0\uC18D\uC801\uC73C\uB85C \uB178\uB825\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4.
seinfo.intro.label.00540=Driving human progress.
seinfo.intro.label.00550=\uD604\uB300\uC790\uB3D9\uCC28\uC758 \uBAA8\uB4E0 \uD65C\uB3D9\uC758 \uC911\uC2EC\uC5D0\uB294 \uC0AC\uB78C\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uC9C0\uB09C \uB0A0 \uB354 \uB098\uC740 \uC0AC\uD68C\uB97C \uB9CC\uB4E4\uAE30\uC704\uD574 \uACE0\uD488\uC9C8\uC758 \uC81C\uD488\uC744 \uC0DD\uC0B0\uD574\uC654\uB2E4\uBA74 \uC774\uC81C\uB294 \uC0AC\uB78C \uC911\uC2EC\uC758 \uBBF8\uB798 \uBAA8\uBE4C\uB9AC\uD2F0 \uD601\uC2E0\uC744 \uD5A5\uD574 \uB098\uC544\uAC11\uB2C8\uB2E4. \uC778\uB958\uC758 \uC9C4\uBCF4\uB97C \uC704\uD574 \uCD5C\uC2E0 \uAE30\uC220\uC744 \uC5F0\uAD6C\uD558\uACE0 \uBE44\uC988\uB2C8\uC2A4\uB97C \uC218\uC9C1\uC801\uC73C\uB85C \uD655\uC7A5\uD558\uBA70, \uD601\uC2E0\uC801\uC778 \uBAA8\uBE4C\uB9AC\uD2F0 \uC194\uB8E8\uC158\uC744 \uACF5\uAE09\uD574 \uB098\uAC08 \uAC83\uC785\uB2C8\uB2E4.