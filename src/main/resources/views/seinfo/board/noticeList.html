<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{seinfo/layout/SeinfoLayoutMain}">

<th:block layout:fragment="html_head">
    <title></title>
    <th:block layout:fragment="html_css">
        <style>
            .ck-editor-reg{
                width: 700px !important;
                padding: 0px 0px 0px 0px !important;
            }

            .ck-editor-detail{
                width: 700px !important;
                padding: 0px 0px 0px 0px !important;
            }

            .ck-editor__editable {
                max-height: 350px;
            }

            .editorWrap .ck-editor__editable_inline {
                padding: 0 15px; !important;
                height: calc(100vh - 340px)
            }

            .editorWrap.hasFileup .ck-editor__editable_inline {
                height: calc(100vh - 561px)
            }

            .ck.ck-content strong {
                font-weight: bold !important;
            }

            .ck.ck-content ul,
            .ck.ck-content ul li {
                list-style-type: disc !important;
            }

            .ck.ck-content ul {
                padding-left: 40px;
            }

            .ck.ck-content ol,
            .ck.ck-content ol li {
                list-style-type: decimal !important;
            }

            .ck.ck-content ol {
                padding-left: 40px !important;
            }

            .ck-horizontal-line {
                border-top: 1px solid rgb(0,0,0);
                /* 수평선의 두께와 색상*/
                margin: 20px 0;
                /* 수평선의 위아래 간격*/
            }

            .ck-content img {
                width: auto !important;
                height: auto !important;
                max-width: 100%;
                height: auto;
            }

            .ck.ck-balloon-panel {
                z-index: 2001 !important;
            }
        </style>
    </th:block>
</th:block>

<th:block layout:fragment="html_body">
    <div th:replace="~{seinfo/layout/include/frame/navCategory :: menuMid510}"></div>

    <main>
        <div class="subpage-content">
            <h2>[(#{seinfo.board.label.00010})]</h2> <!-- 공지사항 -->
            <div class="notice-list-area">
                <section>
                    <div class="notice-list-top">
                        <!--총 1,234건의 공지사항이 있습니다.-->
                        <div class="total">
                            [(#{seinfo.board.label.00011})] &nbsp;<i><span id="totalRecords"></span>[(#{seinfo.board.label.00012})]</i>[(#{seinfo.board.label.00013})]
                        </div>

                        <div class="search-area">
                            <div class="select-area">
                                <select id="searchType" name="searchType" class="form-select" th:value="${param.searchType}">
                                    <option value="tc">[(#{seinfo.board.label.00014})]</option><!--제목+내용-->
                                    <option value="t">[(#{seinfo.board.label.00015})]</option><!--제목-->
                                    <option value="c">[(#{seinfo.board.label.00016})]</option><!--내용-->
                                </select>
                            </div>
                            <div class="input-area">
                                <input type="text" id="keyword" name="keyword" th:value="${param.keyword}" />
                            </div>
                            <button type="button" id="searchBtn" onclick="reloadNoticeList()" class="secondary-md-btn">조회</button><!--조회-->
                        </div>
                        <!--</form>-->
                    </div>
                    <div class="table-normal-container">
                        <table id="noticeList">
                            <colgroup>
                                <col style="width: 9%" />
                                <col />
                                <col style="width: 12%" />
							    <col style="width: 12%;" />
                                <col style="width: 7%" />
                            </colgroup>
                            <thead>
                            <tr>
                                <th class="text-center">[(#{seinfo.pps.label.00120})]</th><!--번호-->
                                <th class="text-center">[(#{seinfo.board.label.00015})]</th><!--제목-->
								<th class="text-center">등록자</th>
                                <th class="text-center">[(#{seinfo.board.label.00050})]</th><!--등록일-->
                                <th class="text-center">[(#{seinfo.board.label.00051})]</th><!--조회수-->
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <div class="button-area" id="regNoticeBtn" th:if="${adminYn == true}" style="display: none;">						
                        <!--등록하기-->
                        <button type="button" class="primary-md-btn">[(#{seinfo.com.btn.00190})]</button>
                    </div>
                </section>
                <div class="pagination"></div>
            </div>
        </div>
    </main>

    <div th:replace="~{seinfo/board/popupNoticeDetail :: popup01View}"></div>
    <div th:replace="~{seinfo/board/popupNoticeRegForm :: popup01View}"></div>
</th:block>

<th:block layout:fragment="html_js">
    <script type="text/javascript" th:inline="javascript">
        const paginationImages = {
            first: /*[[ @{/static/seinfo/img/icon-pagination-first.svg}]]*/ '',
            prev: /*[[ @{/static/seinfo/img/icon-pagination-prev.svg}]]*/ '',
            next: /*[[ @{/static/seinfo/img/icon-pagination-next.svg}]]*/ '',
            last: /*[[ @{/static/seinfo/img/icon-pagination-last.svg}]]*/ ''
        };

        let pageResult = /*[[${pageResult != null ? pageResult : '{}' }]]*/ {};
        let noticeList = /*[[${noticeList != null ? noticeList : '{}' }]]*/ [];
        let page = /*[[${page != null ? page : '' }]]*/ '';
        const searchType = /*[[${searchType != null ? searchType : '' }]]*/ '';
        const keyword = /*[[${keyword != null ? keyword : '' }]]*/ '';
        const menuId = "NOTICE"
        const userType = /*[[${userType != null ? userType : '' }]]*/ '';        
		const serverAdminYn = /*[[${adminYn == true}]]*/ false;
		const noticeUser = pf.token();

		const adminYn =
		    serverAdminYn === true &&
		    noticeUser != null &&
		    noticeUser.USER_TYPE === 'ADMIN' &&
		    sessionStorage.getItem('seinfo.noticeAdminUser')
		        === String(noticeUser.USER_ID);
        const message = /*[[${message != null ? message : '' }]]*/ '';
        let noticeNo = /*[[${noticeNo != null ? noticeNo : '' }]]*/ '';
        let index = 0;
        const tmpToken = pf.token();

        //초기 페이지 처리
        function getNoticeList() {
            $('#totalRecords').text(pageResult.totalRecords);
            renderTableData();
            renderPagination(pageResult);

            if(adminYn) {
                $('#regNoticeBtn').show();
            } else {
                $('#regNoticeBtn').remove();
            }
        }

        //공지사항 다시 불러오기
        function reloadNoticeList() {

            $.ajax({
                type: "POST",
                url: '/anyone/noticeList/reloadNoticeList',
                data: JSON.stringify({page:page, keyword:$('#keyword').val(), searchType: $('#searchType').val()}),
                contentType: 'application/json',
                success: function (response) {
                    noticeList = response.noticeList;
                    pageResult = response.pageResult;
                    $("#totalRecords").text(pageResult.totalRecords);
                    renderTableData();
                    renderPagination(pageResult);
                },
                error: function (jqXHR) {
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    pf.seinfoAlert.warning('[(#{seinfo.com.msg.00170})] <br> '+ msg);//[조회오류]....
                }
            });
        }

        //목록 그리드 동적처리 : date bind
        function renderTableData() {
            noticeList.forEach(list => {
                if(tmpToken && list.regUserId === tmpToken.USER_ID){
                    list.modifyYn = 'Y';
                }else {
                    list.modifyYn = 'N';
                }
                list.noticeTitle = pf.seinfoComUtil.sliceText(list.noticeTitle, 56);
            });

            let tbody = $('#noticeList tbody');
            tbody.empty();

            $.each(noticeList, function (index, list) {
                let row = `
                    <tr>
                        <td class="text-center">${pf.escapeHtml(list.rnum)}</td>
                        <td class="text-left">
                            <button style="font-weight: 500;" onclick="readNoticeDetail('${pf.safeId(list.noticeNo)}', ${index})">
                                ${pf.escapeHtml(list.noticeTitle)}
                            </button>
                        </td>
						<td class="text-center">${pf.escapeHtml(list.regUserName)}</td>
                        <td class="text-center">${pf.escapeHtml(list.regDt)}</td>
                        <td class="text-center">${pf.escapeHtml(list.inquireCnt)}</td>
                `;
                tbody.append(row);
            });
        }

        //목록 그리드 하단 페이지 처리
        function renderPagination(pageResult) {
            let pagination = "";

            //첫 페이지 버튼
            if(pageResult.cPage > 1) {
                pagination += `<button type="button" class="page-navi first" style="display: block" data-page="1">
                    <img src="${paginationImages.first}">
                </button>`;
            }

            //이전페이지 이동
            if(pageResult.hPrev) {
                pagination += `<button type="button" class="page-navi prev" style="display: block" data-page="${pageResult.cPage -1}">
                    <img src="${paginationImages.prev}">
                </button>`;
            }

            //페이지 번호
            let startPage = Math.max(1, pageResult.cPage -5);
            let endPage = Math.min(pageResult.totalPages, pageResult.cPage +5);

            pagination += `<div class="page-links">`;
            for(let i = startPage; i <= endPage; i++) {
                let activeClass = (pageResult.cPage === i) ? "active" : "";
                pagination += `<button class="page-link ${activeClass}" data-page="${i}">${i}</button>`;
            }
            pagination += `</div>`;

            //다음 페이지 버튼
            if(pageResult.hNext){
                pagination += `<button type="button" class="page-navi next" style="display: block" data-page="${pageResult.cPage + 1}">
                    <img src="${paginationImages.next}">
                </button>`;
            }

            //마지막 페이지 버튼
            if(pageResult.cPage < pageResult.totalPages){
                pagination += `<button type="button" class="page-navi last" style="display: block" data-page="${pageResult.totalPages}">
                    <img src="${paginationImages.last}">
                </button>`;
            }
            $(".pagination").html(pagination);
        }

        //공지사항 조회팝업 자동 오픈(메인에서 호출시)
        function readNoticeDetail(noticeNo, noticeIndex) {
            index = noticeIndex;
            getNoticeDetail(noticeNo);
            $('#modalNoticeDetail').show();
        }

        //버튼클릭 : 수정하기 (공지사항 입력팝업 호출 > 수정모드)
        function fnModifyNotice(noticeNo, modifyYn) {
            //첨부파일 초기화
            fileUpDown.uploadInit();
            getNoticeDetailByAdmin(noticeNo, modifyYn);
        }

        //삭제 처리
        function fnDeleteNotice(noticeNo) {
            //중복 로그인 차단 관련

            $.ajax({
                url: "/anyone/noticeList/deleteNotice",
                type: "DELETE",
                contentType: 'application/json',
                data: JSON.stringify({noticeNo:noticeNo}),
                success: function (response) {
                    if(response.success) {
                        pf.seinfoAlert.success('[(#{seinfo.com.msg.00040})]', ()=>{ //삭제되었습니다.
                            reloadNoticeList();
                        });
                    }
                },
                error: function (jqXHR) {
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    pf.seinfoAlert.warning('[(#{seinfo.com.msg.00172})] <br> '+ msg); //[삭제오류]..
                }
            });
        }

        function fnInputSetPlaceholder() {
            $("#keyword").attr("placeholder", "[(#{seinfo.main.msg.00150})]"); //검색어를 입력하세요.
        }

        $(() => {
            if(noticeNo) {
                readNoticeDetail(noticeNo);
            }

            fnInputSetPlaceholder();
            getNoticeList();

            //버튼 클릭: 등록하기 (공지사항 입력합업 호출 > 입력모드)
            $('#regNoticeBtn').on('click', function (e) {
                e.preventDefault();
                if(!adminYn) {
                    pf.seinfoAlert.warning('[(#{seinfo.main.msg.00150})]'); //권한이 불충분합니다.
                    return;
                }

                //첨부파일 초기화
                fileUpDown.uploadInit();
                fileUpDown.initWrite();

                $("#modalNoticeTitle").val('');
                ckedit_init('popupNoticeReg', '', false);
                $('#modalNoticeReg').css('display', 'block');
            });

            //클릭 이벤트 (페이지 이동)
            $(document).on("click", ".pagination button", function (e) {
                page = $(this).data("page");
                reloadNoticeList();
            });

            $("#keyword").on("keyup", function (key) {
                if(key.keyCode==13) {
                    reloadNoticeList();
                }
            });
            //엔터키 이벤트 추가_ 끝
        });
    </script>

    <script  type="text/javascript" th:src="@{/static/seinfo/js/internal/uploadAdapter.js}"></script>
    <script th:replace="~{seinfo/board/popupNoticeRegForm :: popup01Js}"></script>
    <script th:replace="~{seinfo/board/popupNoticeDetail :: popup01Js}"></script>
</th:block>
</html>
