<!-- BODY -->

<!-- JS -->
<th:block layout:fragment="html_js">
    <script th:replace="~{seinfo/board/popupScheduler :: popup01Js}"></script> 

    <script type="text/javascript" th:inline="javascript">
    let calendar; 

    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');

        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            locale: 'ko',

            dayMaxEventRows: 3,
            moreLinkText: '더보기',
            displayEventTime: false, //  시간 표시 제거

            views: {
                dayGridMonth: { dayMaxEventRows: 3 }
            },

 events: function(fetchInfo, successCallback, failureCallback) {
  $.ajax({
    url: "/member/list",
    method: "GET",
    dataType: "json",
    success: function(data) {
      console.log("서버 응답:", data); // 확인용

      // ✅ 1. 날짜별로 데이터 그룹화
  const groupedByDateAndUser = {};
data.forEach(item => {
  const dateKey = item.workDate.split('T')[0];
  const userKey = item.userEmail;
  const groupKey = `${dateKey}_${userKey}`; // ✅ 날짜 + 작성자 기준

  if (!groupedByDateAndUser[groupKey]) groupedByDateAndUser[groupKey] = [];
  groupedByDateAndUser[groupKey].push(item);
});

const events = Object.entries(groupedByDateAndUser).map(([key, items]) => {
  const firstItem = items[0];
  const date = firstItem.workDate.split('T')[0];
  const userName = firstItem.userNm || '작성자';
  
  // ✅ 총 시간 계산
  const totalHours = items.reduce((sum, item) => {
    return sum + (parseFloat(item.hours) || 0);
  }, 0);

  return {
    title: `${totalHours}시간 ${userName} ${items.length}건`,
    start: new Date(firstItem.workDate),
    end: new Date(firstItem.workDate),
    backgroundColor: '#ff9800',
    extendedProps: {
      id: firstItem.id,  // 2025 09 19 추가
      fileGrpId: firstItem.mfileGroupId,
      userEmail: firstItem.userEmail,
      userNm: userName,
      count: items.length,
      totalHours: totalHours,
      allItems: items
    }
  };
});
  /*
  return {
    title: `${userName} ${items.length}건`,
    // start: new Date(date),
    // end: new Date(date),
     start: new Date(firstItem.workDate), // ✅ 시간 포함된 값 사용
     end: new Date(firstItem.workDate),   // ✅ 동일하게 처리
    backgroundColor: '#ff9800',
    extendedProps: {
      fileGrpId: firstItem.mfileGroupId,
      userEmail: firstItem.userEmail,
      userNm: userName,
      count: items.length,
      allItems: items
    }
  };
});
*/

      console.log("📅 대표 이벤트 목록:", events);
      successCallback(events);
    },
    error: function() {
      failureCallback("일정 데이터를 불러올 수 없습니다.");
    }
  });
},


     dateClick: function(info) {
    const clicked = new Date(info.dateStr); // 클릭한 날짜 (00:00)
    const now = new Date(); // 현재 시각

    // 📌 클릭한 날짜 + 현재 시각으로 조합
    clicked.setHours(now.getHours(), now.getMinutes(), now.getSeconds());

    // 화면에 표시
    const formattedDate = clicked.toLocaleString('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    });
    document.getElementById('selectedDate').textContent = formattedDate;

    // 사용자 이름 표시
    const userName = pf.token()?.USER_NM || 'Unknown';
    document.getElementById('loggedInUserName').textContent = userName;

    // 그리드 + 모달 열기
    renderGrid();
    openWorkLogModal(clicked, userName);
    

    // 파일 업로드 모드 초기화
    $('#uploadMode').show();
    $('#downloadMode').hide();
    fileUpDown.uploadInit();
    fileUpDown.initWrite();
}
,

eventClick: function(info) {
    const event = info.event;
    const userEmail = pf.token()?.USER_ID;
    const userType = pf.token()?.USER_TYPE || 'GUEST';
    const isAuthor = event.extendedProps.userEmail === userEmail;
    const isAdmin = userType === 'ADMIN';

    const fileGrpId = event.extendedProps.fileGrpId;
    if (!fileGrpId) {
        alert("파일 그룹 정보가 없습니다.");
        return;
    }

    window.selectedLogId = event.extendedProps.id;
    uploadSetting.fileGrpId = fileGrpId || '';

    const parsedDate = new Date(event.startStr);
    window.selectedWorkDate = getLocalDateTimeString(parsedDate);

    // 날짜/작성자 표시
    const formattedDate = parsedDate.toLocaleString('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    });
    document.getElementById('selectedDate').textContent = formattedDate;

    const authorName = event.extendedProps.userNm || 'Unknown';
    document.getElementById('loggedInUserName').textContent = authorName;

    // 업무 항목 조회
    $.ajax({
        url: `/member/api/worklog/group?fileGrpId=${fileGrpId}`,
        method: 'GET',
        success: function(data) {
            const gridData = data.map(row => ({
                id: row.id,
                content: row.content || '',
                category: row.category || '분석',
                time: row.hours != null ? String(row.hours) : '1',
                approvalStatus: row.approvalStatus
            }));

            renderGrid(gridData);

            // 승인 여부
            const approved = gridData.some(row => row.approvalStatus === "APPROVED");

            if (approved) {
                // 승인된 경우: 모든 버튼 숨김 + 입력 비활성화
                $('#saveBtn, #deleteBtn, #approveBtn, #rejectBtn').hide();
                $('#modalScheduler input, #modalScheduler textarea, #modalScheduler select').prop('disabled', true);
            } else {
                // 승인 전 버튼 표시
                if (isAdmin) {
                    // 관리자: 승인/반려만
                    $('#approveBtn, #rejectBtn').show();
                    $('#saveBtn, #deleteBtn').hide();
                } else if (isAuthor) {
                    // 작성자: 저장/삭제만
                    $('#saveBtn, #deleteBtn').show();
                    $('#approveBtn, #rejectBtn').hide();
                } else {
                    // 일반 사용자: 버튼 모두 숨김
                    $('#saveBtn, #deleteBtn, #approveBtn, #rejectBtn').hide();
                }

                // 입력 활성화 여부
                const editable = isAuthor && !approved;
                $('#modalScheduler input, #modalScheduler textarea, #modalScheduler select').prop('disabled', !editable);
            }

            // 파일 업로드 모드
            if (isAuthor && !approved) {
                fileUpDown.initEdit();
                $('#uploadMode').show();
                $('#downloadMode').hide();
            } else {
                fileUpDown.initView();
                $('#uploadMode').hide();
                $('#downloadMode').show();
            }

            $('#modalScheduler').show();
        },
        error: function(err) {
            console.error("업무 항목 조회 실패:", err);
            alert("업무 데이터를 불러오지 못했습니다.");
        }
    });
}


        });

        calendar.render();
    });
    </script>
</th:block>

</html>
