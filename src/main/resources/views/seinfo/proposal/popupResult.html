<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{seinfo/layout/SeinfoLayoutEmpty}">

<th:block th:fragment="popup01View">
    <div class="modal comm-modal" id="modalResult">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-body">
                <div class="">
                    <section>
                        <!--금번 귀사 제안 내용에 대한
                            신기술 심의 결과를 하기와 같이 안내드립니다. -->
                        <div class="content-description">
                            [(#{seinfo.pps.label.00500})] <br>
                            <i>[(#{seinfo.pps.label.00510})]</i> [(#{seinfo.pps.label.00520})]
                        </div>

                        <div class="table-row-container">
                            <table>
                                <colgroup>
                                    <col width="160px" />
                                    <col />
                                </colgroup>
                                <tbody>
                                <tr>
                                    <th>[(#{seinfo.pps.label.00530})]</th><!--심의 결과-->
                                    <td>
                                        <span style="font-weight: 600;" id="lastResultKo"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>[(#{seinfo.pps.label.00540})]</th><!--심의 내용-->
                                    <td>
                                        <p id="lastResultCont">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                    <div class="button-area">
                        <button id="modalOzViewBtn" onclick="fnModalOzViewBtn()" class="secondary-md-btn"
                                style="display: none;" disabled>[(#{seinfo.pps.label.00550})]</button> <!--폐기확인서 조회-->
                        <button class="comm-close-modal-btn primary-md-btn">[(#{seinfo.com.btn.00040})]</button> <!--닫기-->
                        <!--<button class="comm-close-modal-btn secondary-md-btn">닫기</button>-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="popup01Js">
    <script type="text/javascript" th:inline="javascript">

        function fnInitPopupReuslt() {
            if (processMap.lastResult === 'Y') {
                $('#lastResultKo').css('color', '#2dc0f0');
            } else {
                $('#lastResultKo').css('color', '#7c7c7c');
            }

            if (processMap.addRequestYn === 'Y') {
                $('#modalOzViewBtn').css('display', 'block');
                $('#modalOzViewBtn').attr('disabled', false);
            } else {
                $('#modalOzViewBtn').css('display', 'none');
                $('#modalOzViewBtn').attr('disabled', true);
            }
        }

        function fnModalOzViewBtn() {
            let arrLinkparam = [];
            arrLinkparam.push('lang=' + pf.zzzMain.localStoreLang);
            arrLinkparam.push('&proposalNo=' + processMap.proposalNo);
            //arrLinkparam.push('&assessorTeam=' + assessorTeam);

            let encData = pf.zzzUtil.getEncryptParam(arrLinkparam.join(''));

            let tnWidth = 1210;
            let tnHeight = 800;

            let xPos = window.top.outerWidth / 2 + window.top.screenX - (tnWidth / 2);
            let yPos = window.top.outerHeight / 2 + window.top.screenY - (tnHeight / 2);

            let rtnLinkUrl = '/view/popupDelReport?paramData=' + encData;

            window.open(rtnLinkUrl, 'reportViewer', "width=" + tnWidth + ", " + "height=" + tnHeight + ", " + "left=" + xPos + ", " + "top=" + yPos + ", " + "location=no,resizable=yes,status=no,toolbar=no,menubar=no,scrollbars=no,fullscreen=no");
        }

    </script>
</th:block>

</html>
