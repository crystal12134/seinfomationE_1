<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"  layout:decorate="~{seinfo/layout/SeinfoLayoutMain}">

<th:block layout:fragment="html_head">
    <title></title>
    <th:block layout:fragment="html_css">
        <style>
            .ui-datepicker{z-index: 99 !important}

            .inline-bar{
                display:flex;
                align-items:center;
                gap:10px;
                flex-wrap:nowrap;          /* 한 줄 고정 */
            }

            .inline-bar button {
                width: 200px;
            }
            .inline-bar button:first-of-type{  /* 첫 버튼(검색)을 오른쪽으로 밀기용 스페이서로 */
                margin-left:auto;
            }

            /* 셀 전체를 플렉스로: 텍스트 왼쪽, 버튼 오른쪽 */
            .tui-grid-cell.qoo-rightbtn .qoo-cellwrap {
                display: flex;
                align-items: center;
                gap: 6px;                /* 텍스트-버튼 간격 */
                width: 100%;
            }

            /* 텍스트 영역이 남는 공간을 차지하면서 줄임표 처리 */
            .tui-grid-cell.qoo-rightbtn .manager-name {
                flex: 1 1 auto;          /* 남는 공간을 먹음 */
                min-width: 0;            /* 줄임표 동작 위해 필요 */
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* 버튼을 오른쪽 끝으로 밀어붙이기 */
            .tui-grid-cell.qoo-rightbtn .btn-team-manager {
                margin-left: auto;       /* 핵심: 오른쪽 끝 고정 */
                background: none;
                border: none;
                padding: 0 4px;
                cursor: pointer;
            }
            .tui-grid-cell.qoo-rightbtn .btn-team-manager img {
                vertical-align: middle;
            }
            .tui-grid-cell.qoo-rightbtn .btn-team-manager:hover img {
                opacity: 0.75;
            }

        </style>
    </th:block>
    <!-- Toast Editor JS -->
    <script th:src="@{/static/seinfo/js/external/purify.min.js}"></script>
    <script th:src="@{/static/seinfo/js/external/fullcalendar.global.min.js}"></script>
    <script th:src="@{/static/seinfo/js/external/toastgrid/tui-date-picker.js}"></script>
    <script th:src="@{/static/seinfo/js/external/toastgrid/tui-grid.js}"></script>
    <script th:src="@{/static/seinfo/js/external/toastgrid/tui-pagination.js}"></script>

    <!-- Toast Grid css -->
    <link rel="stylesheet" type="text/css" th:href="@{/static/seinfo/css/tui-date-picker.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/seinfo/css/tui-grid.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/seinfo/css/tui-pagination.css}">
</th:block>

<th:block layout:fragment="html_body">
    <div th:replace="~{seinfo/layout/include/frame/navCategory :: menuMid730}"></div>

    <main>
        <div class="subpage-content">
            <h2>[(#{seinfo.admin.label.00320})]</h2> <!--팀관리-->
            <div class="pps-history-area">
                <div class="inline-bar">
                    <label for="teamNm"></label>
                    <input type="text" id="teamNm" placeholder="팀명" />

                    <button type="button" class="primary-sm-btn" onclick="reloadGrid()">검색</button>
                    <button type="button" class="primary-outline-sm-btn" onclick="addRow()">추가</button>
                    <button type="button" class="danger-outline-sm-btn" onclick="deleteSelectedRows()">삭제</button>
                    <button type="button" class="primary-sm-btn" onclick="saveChanges()">저장</button>
                </div>
                <div id="parentGrid"></div>
            </div>
        </div>
    </main>

    <div th:replace="~{seinfo/admin/popupSearchTeamManager :: popup01View}"></div>

</th:block>

<th:block layout:fragment="html_js">
    <script th:replace="~{seinfo/admin/popupSearchTeamManager :: popup01Js}"></script>
    <script type="text/javascript" th:inline="javascript">
        const Grid = tui.Grid;
        let _targetRowKey;
        let parentGrid;
        // 서버에서 내려줄 원본 데이터(수정 전 기준)
        let teamList = /*[[${teamList != null ? teamList : '[]'}]]*/ [];
        let teamMemberList = /*[[${teamMemberList != null ? teamMemberList : '[]'}]]*/ [];
        let saveData = [];
        let checkedData = [];
        const USE_ITEMS = [
            { text: '사용', value: 'Y' },
            { text: '미사용', value: 'N' },
        ];
        USE_MAP = Object.fromEntries(USE_ITEMS.map(i => [i.value, i.text]));

        function loadGrid() {
            const TEAM_MANAGER_ITEMS = teamMemberList.map(tmp => ({
                text: tmp.userNm,
                value: String(tmp.userUid)
            }));
            const TEAM_MANAGER_MAP = Object.fromEntries(
                TEAM_MANAGER_ITEMS.map(it => [it.value, it.text])
            );

            teamList.forEach((row, index) => {
                row.id = index + 1
                row.teamManager = row.teamManager != null ? String(row.teamManager) : '';
            });

            parentGrid = new Grid({
                el: document.getElementById('parentGrid'),
                rowKey: 'teamNo',
                bodyHeight: 420,
                data: teamList,
                scrollX: false,
                scrollY: true,
                rowHeaders: ['checkbox'],
                columns: [
                    {
                        header: 'No.',
                        name : 'id',
                        width: 20,
                        align: 'center',
                    },
                    {
                        header: '팀명',
                        name: 'teamNm',
                        editor: 'text'

                    },
                    {
                        header: '팀장',
                        name: 'teamManager',
                        className: 'qoo-rightbtn',           // ← 이 컬럼 셀에 클래스 부여
                        formatter: ({ value, row }) => {
                            const managerName = TEAM_MANAGER_MAP[String(value)] ?? '';
                            return `
                              <div class="qoo-cellwrap">
                                <span class="manager-name" title="${pf.escapeHtml(managerName)}">${pf.escapeHtml(managerName)}</span>
                                <button class="btn-team-manager" type="button" data-row-key="${pf.safeId(row.rowKey)}">
                                  <img src="/static/seinfo/img/icon-search.svg" alt="검색" style="width:16px;height:16px;" />
                                </button>
                              </div>
                            `;
                        }
                    },
                    {
                        header: '사용여부',
                        name: 'useYn',
                        editor: {
                            type: 'select',
                            options: {
                                listItems: USE_ITEMS
                            }
                        }
                        ,formatter: ({ value }) => USE_MAP[value] ?? '',
                    },
                    // 삭제 시 서버 식별자. 보여줄 필요 없으면 hidden 처리
                    {
                        header: 'UID',
                        name: 'teamNo',
                        hidden: true
                    }
                ]
            });

            parentGrid.on('afterChange', ({ changes /*, origin*/ }) => {
                // 한 번에 여러 셀 변경(붙여넣기 등) 대비 → rowKey 중복 제거
                const touched = new Set(changes.map(c => c.rowKey));

                touched.forEach((rowKey) => {
                    const editedRow = parentGrid.getRow(rowKey);
                    if (!editedRow) return;

                    const key = editedRow.id;

                    const idx = saveData.findIndex(r => r.id === key);
                    if (idx === -1) saveData.push(editedRow);
                    else saveData[idx] = editedRow;
                });
            });

            parentGrid.on('click', function(ev) {
                if (ev.columnName === 'teamManager') {
                    _targetRowKey = ev.rowKey;   // 어떤 행을 바꿀지 저장
                    $("#modalSearchTeamManager").css("display", "block");
                    loadModalGrid();
                }
            });
        }

        /**
         * 행 추가: 비워진 신규 행 추가 후 첫 컬럼 포커스
         */
        function addRow() {
            const newRowData = { id: teamList.length + 1, teamNm: '', useYn: 'Y' };
            saveData.push(newRowData);

            const prevCount = parentGrid.getRowCount();
            parentGrid.appendRow(newRowData, { focus: false });

            const added = parentGrid.getRowAt(prevCount);
            if (added) {
                parentGrid.focus(added.rowKey, 'teamNm');
                parentGrid.startEditing(added.rowKey, 'teamNm');
            }

            teamList = [...teamList, newRowData];
        }

        /**
         * 체크된 행 삭제(그리드 상에서만 먼저 제거)
         * - 실제 서버 반영은 저장 버튼에서 일괄 처리
         */
        function deleteSelectedRows() {
            parentGrid.finishEditing();

            checkedData = parentGrid.getCheckedRows();
            if(!checkedData || checkedData.length === 0){
                pf.seinfoAlert.warning('체크된 행이 없습니다.');
                return null;
            }

            pf.seinfoAlert.confirm('체크된 데이터를 삭제 하시겠습니까?', () => {
                pf.seinfo.ajax({
                        url: '/admin/deleteTeamData',
                        method: 'POST',
                        data : checkedData
                }, (rData)=> {
                    if(rData.process_code === '00') {
                        pf.seinfoAlert.success(rData.data);
                        initCheckedData();
                    }else {
                        pf.seinfoAlert.warning(rData.data.message);
                    }
                });
            });
        }

        function initCheckedData(){
            const selectedIds = checkedData.map(r => r.id).filter(id => id != null);
            const ids = selectedIds ?? checkedData.map(r => r.id);
            const idSet = new Set(ids);

            // 2) 메모리 동기화
            teamList = teamList.filter(r => !idSet.has(r.id));
            saveData = saveData.filter(r => !idSet.has(r.id));

            // 3) 표시용 id 재채번(선택)
            teamList.forEach((row, i) => row.id = i + 1);

            // 4) 그리드 갱신
            parentGrid.resetData(teamList);

            // 5) 정리
            checkedData = [];
        }

        function saveChanges() {
            parentGrid.finishEditing();

           if(!saveData || saveData.length === 0) return null;

           pf.seinfoAlert.confirm('수정된 내역을 저장 하시겠습니까?', () => {
               for(var i=0; i < saveData.length; i++){
                   if( !saveData[i].teamNm || !saveData[i].useYn ){
                       pf.seinfoAlert.warning(saveData[i].id + '행의 필수 내용이 비어있습니다.');
                       return null;
                   }
               }

               pf.seinfo.ajax({
                   url: '/admin/saveTeamData',
                   method: 'POST',
                   data : saveData
               }, (rData)=> {
                   if(rData.process_code === '00') {
                       pf.seinfoAlert.success(rData.data);
                       reloadGrid();
                   }else {
                       pf.seinfoAlert.warning(rData.data.message);
                   }
               })
           });
        }

        function reloadGrid(){
            saveData = [];

            const paramData = {
                teamNm: $('#teamNm').val() || null
            }

            pf.seinfo.ajax({
                url: '/admin/reloadTeamList',
                method: 'POST',
                data : paramData,
            }, (rData)=> {
                teamList = rData.data;
                teamList.forEach((row, index) => {
                    row.id = index + 1;
                    row.teamManager = row.teamManager != null ? String(row.teamManager) : '';
                });
                parentGrid.resetData(teamList);
            });
        }

        $(() => {
            loadGrid();

            $("#teamNm").on("keyup", function (key) {
                if(key.keyCode === 13) {
                    reloadGrid();
                }
            });
        });

    </script>
</th:block>
</html>
