<th:block layout:fragment="html_head">
    <title></title>
    <th:block layout:fragment="html_css">
        <style>

                padding: 0px 0px 0px 0px !important;
            }

            .ck-editor__editable {
                max-height: 350px;
            }

            .editorWrap .ck-editor__editable_inline {

            .editorWrap.hasFileup .ck-editor__editable_inline {

            .ck.ck-content strong {

            }

<th:block layout:fragment="html_body">
    <div th:replace="~{seinfo/layout/include/frame/navCategory :: menuMid530}"></div>

    <main>
        <div class="subpage-content">
            <h2>자유게시판</h2> <!-- 자유게시판 -->
            <div class="notice-list-area">
                <section>
                    <div class="notice-list-top">

                         <div class="total">

                        <div class="search-area">

                                    <option value="t">[(#{seinfo.board.label.00015})]</option><!--제목-->

                            </div>
                            <div class="input-area">
                                <input type="text" id="keyword" name="keyword" th:value="${param.keyword}" />
                            </div>

                        </div>
                        <!--</form>-->
                    </div>
                    <div class="table-normal-container">
                        <table id="freeBoardList">
                            <colgroup>
                                <col style="width: 9%" />
                                <col />
                                <col style="width: 12%" />
                                <col style="width: 7%" />
                            </colgroup>
                            <thead>
                            <tr>
                                <th class="text-center">날짜</th><!--날짜-->
                                <th class="text-center">[(#{seinfo.board.label.00015})]</th><!--제목-->
                                <th class="text-center">글쓴이</th><!--글쓴이-->
                                <th class="text-center">추천</th><!--추천-->
                                <th class="text-center">비추천</th><!--비추천-->
                                <th class="text-center">조회수</th><!--조회수-->

                            </tbody>
                        </table>
                    </div>
                    <div class="button-area" id="regFreeBoardBtn">

        </div>
    </main>

    <div th:replace="~{seinfo/board/popupFreeBoardRegForm :: popup01View}"></div>
</th:block>

<th:block layout:fragment="html_js">
    <script type="text/javascript" th:inline="javascript">
        const paginationImages = {
            first: /*[[ @{/static/seinfo/img/icon-pagination-first.svg}]]*/ '',
            prev: /*[[ @{/static/seinfo/img/icon-pagination-prev.svg}]]*/ '',
            next: /*[[ @{/static/seinfo/img/icon-pagination-next.svg}]]*/ '',
            last: /*[[ @{/static/seinfo/img/icon-pagination-last.svg}]]*/ ''
        };

        let pageResult = /*[[${pageResult != null ? pageResult : '{}' }]]*/ {};
        let freeBoardList = /*[[${freeBoardList != null ? freeBoardList : '{}' }]]*/ [];
        let page = /*[[${page != null ? page : '' }]]*/ '';
        const searchType = /*[[${searchType != null ? searchType : '' }]]*/ '';
        const keyword = /*[[${keyword != null ? keyword : '' }]]*/ '';
        const menuId = "FREEBOARD"
        const userType = /*[[${userType != null ? userType : '' }]]*/ '';
        const adminYn = /*[[${adminYn != null ? adminYn : '' }]]*/ false;
        const message = /*[[${message != null ? message : '' }]]*/ '';
        let freeboardNo = /*[[${freeboardNo != null ? freeboardNo : '' }]]*/ '';
        let index = 0;
        const tmpToken = pf.token();

        //초기 페이지 처리
        function getFreeBoardList() {
            $('#totalRecords').text(pageResult.totalRecords);
            renderTableData();
            renderPagination(pageResult);

            // if(adminYn) {
            //     $('#regFreeBoardBtn').show();
            // } else {
            //     $('#regFreeBoardBtn').remove();
            // }
        }

        //자유게시판 다시 불러오기
        function reloadFreeBoardList() {

            $.ajax({
                type: "POST",
                url: '/board/freeBoardList/reloadFreeBoardList',
                data: JSON.stringify({page:page, keyword:$('#keyword').val(), searchType: $('#searchType').val()}),
                contentType: 'application/json',
                success: function (response) {
                    freeBoardList = response.freeBoardList;
                    pageResult = response.pageResult;
                    $("#totalRecords").text(pageResult.totalRecords);
                    renderTableData();
                    renderPagination(pageResult);
                },
                error: function (jqXHR) {
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    pf.seinfoAlert.warning('[(#{seinfo.com.msg.00170})] <br> '+ msg);//[조회오류]....
                }
            });
        }

        //목록 그리드 동적처리 : date bind
        function renderTableData() {
            freeBoardList.forEach(list => {
                if(tmpToken && list.regUserId === tmpToken.USER_ID){
                    list.modifyYn = 'Y';
                }else {
                    list.modifyYn = 'N';
                }
                list.freeboardTitle = pf.seinfoComUtil.sliceText(list.freeboardTitle, 56);
            });

            let tbody = $('#freeBoardList tbody');
            tbody.empty();

            $.each(freeBoardList, function (index, list) {
                let row = `
                    <tr>
                        <td class="text-center">${pf.escapeHtml(list.regDt)}</td>
                        <td class="text-left">
                            <button style="font-weight: 500;" onclick="moveView('${pf.safeId(list.freeboardNo)}')">
                                ${pf.escapeHtml(list.freeboardTitle)} 
                                <span style="color: green;">[${pf.escapeHtml(list.commentCount)}]</span>
                            </button>
                        </td>                       
						<td class="text-center">${pf.escapeHtml(list.authorId ?? '탈퇴회원')}</td>
                        <td class="text-center" style="color: red">${pf.escapeHtml(list.likeCount)}</td>
                        <td class="text-center" style="color: blue">${pf.escapeHtml(list.hateCount)}</td>
                        <td class="text-center">${pf.escapeHtml(list.inquireCnt)}</td>
                    </tr>
                `;
                tbody.append(row);
            });
        }
console.log(freeBoardList);
        //목록 그리드 하단 페이지 처리
        function renderPagination(pageResult) {
            let pagination = "";

            //첫 페이지 버튼
            if(pageResult.cPage > 1) {
                pagination += `<button type="button" class="page-navi first" style="display: block" data-page="1">
                    <img src="${paginationImages.first}">
                </button>`;
            }

            //이전페이지 이동
            if(pageResult.hPrev) {
                pagination += `<button type="button" class="page-navi prev" style="display: block" data-page="${pageResult.cPage -1}">
                    <img src="${paginationImages.prev}">
                </button>`;
            }

            //페이지 번호
            let startPage = Math.max(1, pageResult.cPage -5);
            let endPage = Math.min(pageResult.totalPages, pageResult.cPage +5);

            pagination += `<div class="page-links">`;
            for(let i = startPage; i <= endPage; i++) {
                let activeClass = (pageResult.cPage === i) ? "active" : "";
                pagination += `<button class="page-link ${activeClass}" data-page="${i}">${i}</button>`;
            }
            pagination += `</div>`;

            //다음 페이지 버튼
            if(pageResult.hNext){
                pagination += `<button type="button" class="page-navi next" style="display: block" data-page="${pageResult.cPage + 1}">
                    <img src="${paginationImages.next}">
                </button>`;
            }

            //마지막 페이지 버튼
            if(pageResult.cPage < pageResult.totalPages){
                pagination += `<button type="button" class="page-navi last" style="display: block" data-page="${pageResult.totalPages}">
                    <img src="${paginationImages.last}">
                </button>`;
            }
            $(".pagination").html(pagination);
        }

       
        //버튼클릭 : 수정하기 (자유게시판 입력팝업 호출 > 수정모드)
        function fnModifyFreeBoard(freeboardNo, modifyYn) {
            //첨부파일 초기화
            fileUpDown.uploadInit();
            getFreeBoardDetailByAdmin(freeboardNo, modifyYn);
        }

        //삭제 처리
        function fnDeleteFreeBoard(freeboardNo) {
            //중복 로그인 차단 관련

            $.ajax({
                url: "/anyone/freeBoardList/deleteFreeBoard",
                type: "DELETE",
                contentType: 'application/json',
                data: JSON.stringify({freeboardNo:freeboardNo}),
                success: function (response) {
                    if(response.success) {
                        pf.seinfoAlert.success('[(#{seinfo.com.msg.00040})]', ()=>{ //삭제되었습니다.
                            reloadFreeBoardList();
                        });
                    }
                },
                error: function (jqXHR) {
                    let response = JSON.parse(jqXHR.responseText).message;
                    let msg = pf.zzzUtil.strNvlChange(response, jqXHR.responseJSON.process_msg);
                    pf.seinfoAlert.warning('[(#{seinfo.com.msg.00172})] <br> '+ msg); //[삭제오류]..
                }
            });
        }

        function fnInputSetPlaceholder() {
            $("#keyword").attr("placeholder", "[(#{seinfo.main.msg.00150})]"); //검색어를 입력하세요.
        }

         //자유게시판 상세페이지로 이동
        function moveView(freeboardNo) {
            let arrLinkparam = [];
            arrLinkparam.push('&freeboardNo=' + freeboardNo);
            arrLinkparam.push('&page=' + page);

            let encData = pf.zzzUtil.getEncryptParam(arrLinkparam.join(''));
            location.href = contextPath + '/board/freeBoardList/freeBoardDetail'+  '?paramData=' + encData;
        }

        $(() => {
            //로그인 경고
            if(message.trim().length > 0) {
                pf.seinfoAlert.warning(message, () => {
                    if(userType === "LRTP") {
                        location.href = contextPath + '/template/errPage';
                    } else {
                        location.href = contextPath + '/anyone/errPage';
                    }
                });
                return;
            }

            if(freeboardNo) {
                readFreeBoardDetail(freeboardNo);
            }

            fnInputSetPlaceholder();
            getFreeBoardList();

            //버튼 클릭: 등록하기 (자유게시판 입력합업 호출 > 입력모드)
            $('#regFreeBoardBtn').on('click', function (e) {
                e.preventDefault();
                // if(!adminYn) {
                //     pf.seinfoAlert.warning('[(#{seinfo.main.msg.00150})]'); //권한이 불충분합니다.
                //     return;
                // }

                $("#modalFreeBoardTitle").val('');
                ckedit_init('popupFreeBoardReg', '', false);
                $('#modalFreeBoardReg').css('display', 'block');
            });

            //클릭 이벤트 (페이지 이동)
            $(document).on("click", ".pagination button", function (e) {
                page = $(this).data("page");
                reloadFreeBoardList();
            });

            $("#keyword").on("keyup", function (key) {
                if(key.keyCode==13) {
                    reloadFreeBoardList();
                }
            });
            //엔터키 이벤트 추가_ 끝
        });
    </script>

    <script  type="text/javascript" th:src="@{/static/seinfo/js/internal/uploadAdapter.js}"></script>
    <script th:replace="~{seinfo/board/popupFreeBoardRegForm :: popup01Js}"></script>
</th:block>
</html>
