<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>비밀번호 재설정</title>
<style>body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6f9;color:#223047;margin:0;padding:40px 18px}main{max-width:420px;margin:auto;background:white;padding:30px;border-radius:12px}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:12px;font-size:16px;margin-top:8px}button{background:#155bc1;color:white;border:0;cursor:pointer;margin-top:24px}button:disabled{opacity:.5}#result{white-space:pre-wrap;line-height:1.6}p{line-height:1.6}</style></head>
<body><main><h1>비밀번호 재설정</h1><p>영문·숫자·특수문자를 포함한 8~20자로 입력해주세요.</p>
<form id="resetForm"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="20" required>
<label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="20" required><button id="saveButton" type="submit">비밀번호 변경</button></form>
<p id="result" role="status" aria-live="polite"></p><p><a href="/login/login">로그인 화면으로</a></p></main>
<script src="/static/seinfo/js/internal/password-reset.js"></script></body></html>
